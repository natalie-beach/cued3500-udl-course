<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CUED 3500 | Chapter 1</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17334f;background:#f3f7fc}*{box-sizing:border-box}body{margin:0}header{background:#123758;color:white;padding:24px max(24px,calc((100vw - 1120px)/2))}header h1{font-size:clamp(25px,3vw,39px);margin:6px 0}header p{margin:0;color:#d6e7f7}.layout{max-width:1120px;margin:24px auto;padding:0 18px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px}aside,.panel{background:white;border:1px solid #dce6f2;border-radius:17px;box-shadow:0 5px 20px #183c5c0a}aside{padding:18px;height:max-content;position:sticky;top:16px}aside h2{font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:#637c92}nav button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:12px 10px;color:#26435e;cursor:pointer;font:inherit;font-size:14px;margin:4px 0}nav button.active{background:#e5f0fb;color:#0b457b;font-weight:700}nav button:hover{background:#f0f6fc}.panel{padding:clamp(18px,3vw,36px)}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;color:#39719b;text-transform:uppercase}h2{font-size:clamp(23px,3vw,32px);margin:10px 0 14px}h3{font-size:19px;margin:24px 0 8px}p{line-height:1.65}figure{margin:22px 0}figure img{width:100%;height:auto;border-radius:12px;border:1px solid #dbe7f3}figcaption{font-size:13px;color:#5c7185;margin-top:8px}video{display:block;width:100%;max-height:550px;background:#081b2e;border-radius:12px;margin:18px 0}.note{background:#eff6fd;border-left:4px solid #3979b4;padding:13px 17px;border-radius:6px;margin:16px 0;line-height:1.55}.questions{margin-top:30px;border-top:2px solid #dce8f3;padding-top:12px}.question{border:1px solid #dbe5ef;border-radius:13px;padding:18px;margin:16px 0}.question h4{font-size:16px;margin:0 0 14px;line-height:1.45}.option{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid #dce5ee;border-radius:9px;margin:7px 0;cursor:pointer}.option:has(input:checked){border-color:#367cb5;background:#edf6ff}.option input{margin-top:3px}.feedback{padding:11px 13px;border-radius:9px;background:#fff5e7;color:#6d480e;margin-top:12px}.feedback.correct{background:#e8f7ee;color:#18613a}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:25px;flex-wrap:wrap}button.primary{background:#164b77;color:white;border:0;border-radius:10px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer}button.primary:disabled{opacity:.5;cursor:not-allowed}button.secondary{background:#e9f1f8;border:0;border-radius:10px;padding:12px 18px;font:inherit;color:#18466b;cursor:pointer}.progress{height:9px;background:#dce8f3;border-radius:99px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:#27856b;transition:width .2s}.small{font-size:13px;color:#637b91}.score{font-size:30px;font-weight:800;color:#166e54}.end{padding:18px;background:#e8f7ee;border-radius:12px}.hidden{display:none}@media(max-width:780px){.layout{display:block}aside{position:static;margin-bottom:18px}nav{display:grid;grid-template-columns:repeat(2,1fr)}.panel{padding:18px}}</style></head><body>
<header><div class="eyebrow" style="color:#a8cbe7">CUED 3500 · UDL Lesson Planning</div><h1>Chapter 1: Planning with Purpose</h1><p>Standards · Central Focus · Objectives · Assessment Alignment</p></header><div class="layout"><aside><h2>Your learning path</h2><nav id="nav"></nav><div class="small" id="progressText"></div><div class="progress"><div id="progressBar"></div></div><p class="small">Practice questions provide hints and feedback. Your final mastery score is based on five skills. You can retry until you earn 5/5.</p></aside><main class="panel"><div id="content"></div><div class="actions"><button class="secondary" id="prev">← Previous</button><button class="primary" id="next">Next section →</button></div></main></div>
<script>
const sections=[
{title:'Backward Design',time:'5 minutes',html:`<p>Effective lesson planning begins with what students need to learn, not with a fun activity. Start with the grade-level standard, determine the lesson objective, decide what evidence will show learning, and then choose instruction that prepares students to succeed.</p><figure><img src="assets/backward-design.png" alt="Backward design diagram showing the sequence from standard to objective to assessment to instruction, with a water cycle example"><figcaption>Study the four steps and the water cycle example.</figcaption></figure><h3>Spot the mismatch</h3><p>Two activities can be engaging, but only one may support the actual learning target. Look at how the following plans connect, or fail to connect, their standards, objectives, assessments, and instruction.</p><figure><img src="assets/mismatches.png" alt="Comparison of an activity-first volcano lesson with a standards-aligned water cycle lesson"><figcaption>Notice that sharing a science theme is not the same as aligning to the standard.</figcaption></figure><div class="note"><strong>Remember:</strong> The activity is the vehicle. The learning objective is the destination.</div>`,qs:[['Why does backward design begin with the standard?',['It helps the teacher select the most entertaining activity.','It identifies the learning students are expected to demonstrate.','It removes the need for assessment.'],1,'The standard tells us the learning goal.'],['A teacher plans a volcano craft, but the objective requires students to explain the water cycle. What is the main issue?',['The craft and objective do not align.','Students should never do crafts.','The objective must always be a worksheet.'],0,'Look for evidence that the activity supports the actual objective.'],['Which sequence best represents backward design?',['Activity → Materials → Objective → Standard','Standard → Objective → Assessment → Instruction','Assessment → Activity → Standard → Objective'],1,'Start with the learning goal and work toward the teaching activities.']]},
{title:'Chunking Standards',time:'4 minutes',html:`<p>A Tennessee academic standard may describe learning that develops across many lessons. Your lesson plan needs the <strong>complete TN standard</strong> and a <strong>broken down or chunked version</strong> focused on what you will teach today.</p><p>Strikethrough is a planning tool: it lets you preserve the original language while visually showing what is <em>not</em> the focus of this particular lesson. Then rewrite the selected portion in language appropriate for the students' grade level.</p><figure><img src="assets/chunking.png" alt="Three examples of chunking Tennessee standards in grade 2 math, grade 3 science, and grade 3 ELA, using strikethrough and kid-friendly rewrites"><figcaption>Compare the full standard, the marked-up standard, and the broken down version in each row.</figcaption></figure><div class="note"><strong>In your template:</strong> Copy the full standard and code in the first box. Put the focused, kid-friendly version in the second box.</div>`,qs:[['Why might a teacher cross out part of a standard during planning?',['To show what will not be taught in this particular lesson.','To permanently remove the requirement from the curriculum.','To make the standard easier to grade.'],0,'The full standard still matters over time.'],['Which is the best broken down standard for a lesson focused on adding within 100?',['Students will complete a worksheet.','Add numbers within 100 using place-value strategies.','Students will learn all addition and subtraction concepts.'],1,'Choose a focused description of student learning, not an activity.']]},
{title:'Conceptual & Procedural',time:'6 minutes',html:`<p>Central focus has three parts in your lesson plan: one <strong>general statement</strong> naming the content goal, a <strong>conceptual understanding</strong> statement about ideas and relationships, and a <strong>procedural fluency</strong> statement about the processes students will demonstrate.</p><p>Knowing <em>how</em> to follow steps is not the same as knowing <em>why</em> those steps work. Both matter. Watch the explanation, then classify the statements below.</p><video controls preload="metadata" playsinline aria-label="Knowing How versus Knowing Why instructional video"><source src="assets/conceptual-procedural.mp4" type="video/mp4">Your browser cannot play this video.</video><div class="note"><strong>Example, water cycle:</strong><br><strong>General:</strong> Students will describe and label the water cycle.<br><strong>Conceptual:</strong> Students will explain how the stages connect in a repeating cycle.<br><strong>Procedural:</strong> Students will label the stages on a water cycle diagram.</div>`,qs:[['Which statement best emphasizes conceptual understanding?',['Students will label a diagram.','Students will explain how the parts of a plant support its survival.','Students will cut out vocabulary cards.'],1,'Conceptual understanding focuses on meaning and relationships.'],['Which statement best emphasizes procedural fluency?',['Students will explain why place value matters.','Students will recognize that parts of a whole are related.','Students will break apart a two-digit number into tens and ones.'],2,'Procedural fluency focuses on an observable process.'],['What belongs in the general statement of central focus?',['The overarching content goal of the lesson.','A list of every classroom activity.','Only the grading criteria.'],0,'The general statement identifies the big learning goal.']]},
{title:'Measurable Objectives',time:'6 minutes',html:`<p>Your objectives tell what students will <strong>do to demonstrate learning</strong>. Words such as <em>know</em>, <em>learn</em>, and <em>understand</em> do not by themselves identify observable performance. An objective can include a number and still be unclear if it never says what students will do.</p><p>Watch how an unclear objective becomes a measurable one. Notice the action, the conditions when needed, and the mastery criterion. A criterion may be numerical or performance-based depending on the learning.</p><video controls preload="metadata" playsinline aria-label="Writing measurable lesson objectives instructional video"><source src="assets/objectives.mp4" type="video/mp4">Your browser cannot play this video.</video><div class="note"><strong>Weak:</strong> Students will know the different letter sounds.<br><strong>Stronger:</strong> Given five spoken one-syllable words, students will substitute the beginning sound to create a new word correctly in at least four attempts.</div>`,qs:[['What makes “Students will understand fractions with 90% accuracy” weak?',['It contains a percentage.','It does not identify what students will do to show understanding.','Fractions cannot be assessed.'],1,'A number alone does not make learning observable.'],['Which objective is most measurable?',['Students will explore plants.','Students will appreciate the water cycle.','Given a water cycle diagram, students will correctly label all four stages.'],2,'Look for a clear student action and success criterion.'],['When is a performance-based criterion especially useful?',['When the learning is best judged by observable qualities in a product or performance.','Only when students are too young for numbers.','When the teacher does not want to assess learning.'],0,'Think about rubrics or clearly described performance features.']]},
{title:'Connect the Pieces',time:'4 minutes',html:`<p>Before moving to assessment in Chapter 2, check that the standard, conceptual and procedural learning, objective, and assessment all point toward the same goal. A lesson can have strong individual pieces and still fail if those pieces do not connect.</p><figure><img src="assets/alignment.png" alt="Diagram linking a standard to conceptual and procedural thinking, objectives, and the next step of assessment"><figcaption>Use this graphic as a final planning check.</figcaption></figure><div class="note"><strong>Ask yourself:</strong> What must students learn? What will they do to show it? Would the assessment actually capture that learning?</div>`,qs:[['A lesson objective asks students to explain how plant parts function, but the assessment only asks them to color a plant. What should change?',['The assessment should collect evidence that students can explain the functions.','The teacher should remove the objective.','Coloring is always sufficient evidence.'],0,'The assessment must measure the intended learning.'],['Which question is most useful before choosing instructional activities?',['Will the students think this is fun?','Will this prepare students to demonstrate the objective?','Can I find the materials quickly?'],1,'Instruction should prepare students for the intended learning evidence.']]},
{title:'Mastery Check',time:'5 points',html:`<p>You've reviewed the planning process and practiced each skill. Now demonstrate your understanding independently. Each question represents one mastery point. If you miss a question, you'll get a hint and can retry it. You keep every point you've already earned.</p><div class="note"><strong>Goal:</strong> 5 out of 5 mastery points. You may revisit earlier sections whenever you need a refresher.</div>`,mastery:true,qs:[['A grade-level standard includes several skills. What is the strongest approach for planning one lesson?',['Select a manageable portion while preserving the standard’s overall intent.','Ignore the standard and choose an engaging activity.','Require every skill in the standard in one lesson.'],0,'Consider what chunking accomplishes.'],['Which statement is a clear general central focus?',['Students will complete a plant worksheet.','Students will identify the major parts of a plant and their functions.','Students will enjoy science.'],1,'Name the overarching content goal, not an activity.'],['Which statement best expresses conceptual understanding?',['Students will glue labels onto a plant diagram.','Students will cut out four pictures.','Students will explain how roots and stems help plants survive.'],2,'Look for ideas and relationships.'],['Which statement best expresses procedural fluency?',['Students will sequence and label the stages of the water cycle.','Students will appreciate nature.','Students will understand that water moves in a cycle.'],0,'Find the process students can demonstrate.'],['Which objective is strongest?',['Students will learn about plant structures.','Given a plant diagram, students will correctly label four named parts.','Students will understand plants with 100% accuracy.'],1,'Look for observable performance and a clear criterion.']]}];
const storageKey='cued3500_ch1_v3';let state;try{state=JSON.parse(localStorage.getItem(storageKey))||{}}catch(e){state={}};state.page??=0;state.answers??={};state.mastered??={};state.feedback??={};function save(){try{localStorage.setItem(storageKey,JSON.stringify(state))}catch(e){}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const s=sections[state.page],p=state.page;document.getElementById('nav').innerHTML=sections.map((x,i)=>`<button class="${i===p?'active':''}" data-page="${i}">${i+1}. ${esc(x.title)} ${i===5?'★':''}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=Number(b.dataset.page);save();render()});let score=Object.keys(state.mastered).filter(k=>k.startsWith('5:')&&state.mastered[k]).length;document.getElementById('progressText').textContent=`Chapter progress: ${p+1} of 6 sections · Mastery ${score}/5`;document.getElementById('progressBar').style.width=`${score*20}%`;let h=`<div class="eyebrow">Section ${p+1} of 6 · ${esc(s.time)}</div><h2>${esc(s.title)}</h2>${s.html}<div class="questions"><h3>${s.mastery?'Show what you know':'Practice what you learned'}</h3><p class="small">${s.mastery?'Five mastery points · unlimited retries':'Choose an answer and check your thinking. Incorrect answers show a hint.'}</p>`;s.qs.forEach((q,i)=>{const key=`${p}:${i}`,mastered=!!state.mastered[key],value=state.answers[key],fb=state.feedback[key];h+=`<div class="question"><h4>${i+1}. ${esc(q[0])} ${mastered?'✓':''}</h4>`;q[1].forEach((opt,j)=>{h+=`<label class="option"><input type="radio" name="q${i}" data-question="${i}" value="${j}" ${value===j?'checked':''} ${mastered?'disabled':''}><span>${esc(opt)}</span></label>`});if(fb)h+=`<div class="feedback ${mastered?'correct':''}">${mastered?'Correct. '+(s.mastery?'Mastery point earned.':'Well done.'):esc(q[3])+' Try again after reviewing the instruction.'}</div>`;h+='</div>'});h+=`<button class="primary" id="check">Check answers</button>`;if(s.mastery&&score===5)h+=`<div class="end"><strong>Chapter 1 mastered: 5/5!</strong><p>You can return to any section as a reference while writing your own lesson plan.</p></div>`;if(p===4)h+=`<div class="note"><strong>Optional:</strong> Open your own UDL lesson plan template and draft the standard, chunked standard, central focus, and up to three objectives. You may also return later.</div>`;h+='</div>';document.getElementById('content').innerHTML=h;document.querySelectorAll('[data-question]').forEach(el=>el.onchange=()=>{state.answers[`${p}:${el.dataset.question}`]=Number(el.value);state.feedback[`${p}:${el.dataset.question}`]=false;save()});document.getElementById('check').onclick=()=>{s.qs.forEach((q,i)=>{const key=`${p}:${i}`;if(state.mastered[key])return;if(state.answers[key]===undefined)return;state.feedback[key]=true;if(state.answers[key]===q[2])state.mastered[key]=true});save();render()};document.getElementById('prev').disabled=p===0;document.getElementById('prev').onclick=()=>{state.page=Math.max(0,p-1);save();render();scrollTo(0,0)};document.getElementById('next').textContent=p===5?'Return to first section':'Next section →';document.getElementById('next').onclick=()=>{state.page=(p+1)%sections.length;save();render();scrollTo(0,0)}}render();
</script></body></html>
