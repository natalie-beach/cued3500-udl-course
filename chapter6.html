<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 6 · Diverse Learners</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#183650;background:#f2f7fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(110deg,#0a426e,#187bb5);color:white;padding:25px max(20px,calc((100vw - 1120px)/2))}header h1{margin:5px 0;font-size:clamp(26px,3vw,40px)}header p{margin:0;color:#dcefff}.layout{max-width:1120px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:235px minmax(0,1fr);gap:22px}aside,main{background:white;border:1px solid #dce7f1;border-radius:16px;box-shadow:0 4px 18px #2342a10a}aside{padding:17px;height:max-content;position:sticky;top:12px}main{padding:clamp(18px,3vw,34px)}aside h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:#54718a}nav button{display:block;width:100%;padding:11px;text-align:left;border:0;border-radius:9px;background:transparent;color:#254966;cursor:pointer;font:inherit;font-size:14px;margin:4px 0}nav button.active{background:#e4f2fd;font-weight:700;color:#074f82}h2{font-size:clamp(24px,3vw,32px);margin:8px 0 15px}h3{font-size:19px;margin:12px 0}p,li{line-height:1.55}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#2779a5}.small{font-size:13px;color:#57728a}.note{background:#eaf5ff;border-left:4px solid #2384bc;padding:13px 16px;border-radius:8px;margin:16px 0}.warn{background:#fff4e4;border-left:4px solid #c68a26;padding:13px 16px;border-radius:8px;margin:16px 0}.task{padding:18px;border:1px solid #d6e4f0;border-radius:12px;margin:16px 0}.choices{display:grid;gap:8px;margin:12px 0}.choice{font:inherit;text-align:left;width:100%;padding:12px 13px;background:#f8fbff;border:2px solid #d4e4ef;border-radius:9px;cursor:pointer;color:#183650;line-height:1.45}.choice.selected{border-color:#0874b5;background:#e5f3fd}.feedback{padding:11px 13px;border-radius:8px;background:#fff0dc;color:#7a4a0a;margin:10px 0}.feedback.ok{background:#e4f6e9;color:#14643a}.primary,.secondary{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:11px 16px;font-weight:700}.primary{background:#135f94;color:white}.secondary{background:#e7f0f7;color:#184968}.primary:disabled{opacity:.5;cursor:default}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:28px}input,textarea{width:100%;font:inherit;padding:11px;border:1px solid #afc8d9;border-radius:8px;color:#173650}textarea{min-height:105px;resize:vertical}label{display:block;font-weight:700;margin:14px 0 6px}.progress{height:10px;border-radius:20px;background:#d8e7f1;overflow:hidden;margin:10px 0}.progress div{height:100%;background:#1c9872;width:0}figure{margin:16px 0}figure img{width:100%;border-radius:12px;border:1px solid #dbe6ee}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.tag{border-radius:25px;padding:5px 10px;font-size:12px;font-weight:800;background:#e5f1fc}.sample{background:#f8fbff;border:1px solid #dbe6f1;border-radius:10px;padding:15px;margin:10px 0}.end{background:#e5f5ea;padding:18px;border-radius:10px}.score{font-size:25px;font-weight:800;color:#146a4d}video{width:100%;max-height:450px;background:#0d2b45;border-radius:12px}a{color:#0d6199}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #efa930;outline-offset:2px}@media(max-width:790px){.layout{display:block}aside{position:static;margin-bottom:16px}nav{display:grid;grid-template-columns:1fr 1fr}main{padding:18px}}
</style></head><body><header><div class="eyebrow" style="color:#bde2ff">CUED 3500 · UDL Lesson Planning</div><h1>Chapter 6: Diverse Learners</h1><p>Different access points. Same learning goal. Meaningful growth for everyone.</p></header><div class="layout"><aside><h2>Learning path</h2><nav id="nav"></nav><p class="small" id="progressText"></p><div class="progress"><div id="progressBar"></div></div><p class="small">Practice attempts are recorded. Mastery: 4 points, unlimited retries.</p><label for="studentCode">Your six-digit code</label><input id="studentCode" maxlength="6" inputmode="numeric" placeholder="000000"><button class="primary" id="saveCode" style="width:100%;margin-top:8px">Save code / Switch student</button><button class="secondary" id="resetCode" style="width:100%;margin-top:8px">Start fresh for this code</button><p class="small" id="syncStatus" aria-live="polite"></p><p class="small"><a href="index.html">Ch. 1</a> · <a href="chapter2.html">Ch. 2</a> · <a href="chapter3.html">Ch. 3</a> · <a href="chapter4.html">Ch. 4</a> · <a href="chapter5.html">Ch. 5</a></p></aside><main><div id="content"></div><div class="actions"><button id="prev" class="secondary">← Previous</button><button id="next" class="primary">Next section →</button></div></main></div><script>
const ENDPOINT='https://script.google.com/macros/s/AKfycbzIzwQkZEqVtGKF7g3-XSpEajvDp6wRi5hqYjyo5VZ96IGu4vOYJ-N_hjojvgmZaTtH/exec';
const PREFIX='cued3500_ch6_diverse_v1_';
const titles=['Access for Everyone','Same Goal, Different Supports','Enrichment, Not Busywork','Put It in Procedures','Same-Story Repair','Mastery Lab'];
const access=[{title:'Plant-part functions',prompt:'Students must explain the functions of four plant parts, with at least three correct. Which access point helps without lowering the goal?',options:['Allow everyone to reference a labeled plant diagram while practicing, then assess the same four functions under the planned assessment conditions.','Have students who struggle color a flower instead of explaining its parts.','Give students who struggle only two plant parts and mark them proficient.'],correct:0,why:'A diagram provides an access point during learning. The intended content and mastery criterion remain unchanged.'},{title:'Explaining a text',prompt:'Students must explain a character’s decision using two story details. Which classroom-wide support makes the task more accessible?',options:['Let some students skip the evidence requirement.','Provide a story-detail organizer and model how to use it; students can choose whether they need it.','Ask only confident readers to explain the decision.'],correct:1,why:'The organizer helps students reach the same evidence-based explanation without removing the expectation.'},{title:'Fractions',prompt:'Students must demonstrate three out of four equivalent fractions. Which plan preserves the objective?',options:['Replace fractions with a coloring activity for students who need help.','Award mastery for one correct response to students who need support.','Offer fraction strips and teacher modeling during instruction, then use the same mastery criterion for everyone.'],correct:2,why:'Supports change the route into learning, not the target.'}];
const enrich=[{title:'Early finisher',prompt:'A student has already met the plant-part objective. Which next task deepens today’s concept?',options:['Complete a second plant-parts worksheet.','Predict how a plant might change if it could no longer absorb water through its roots, and explain why.','Read an unrelated book while the class finishes.'],correct:1,why:'The prediction applies the same concept to a new situation.'},{title:'Already knows the content',prompt:'Students can identify equivalent fractions. What is a meaningful extension?',options:['Explain, using a fraction model, why two different-looking fractions represent the same amount.','Complete twenty more equivalent-fraction items.','Get a STEM bucket unrelated to fractions.'],correct:0,why:'Explaining why equivalence works extends conceptual understanding.'},{title:'Keep the same concept',prompt:'A lesson compares two characters using evidence. Which extension is aligned?',options:['Begin tomorrow’s lesson about nonfiction text features.','Copy the comparison twice more.','Evaluate how a different choice by one character might change the story, using evidence from the text.'],correct:2,why:'The new reasoning builds on character comparison and story evidence.'}];
const repairs=[{title:'Support missing from procedures',plan:'Diverse Learners section: “Provide a labeled diagram and word bank for anyone who wants them.” Procedures: “Students complete the plant-parts activity independently.”',options:['In the launch, model how to use the labeled diagram; during practice, place the diagram and word bank where any student may use them.','Leave the procedures alone; the Diverse Learners section already mentions supports.','Excuse students who use the word bank from demonstrating mastery.'],correct:0,why:'The procedures must say when and how the access point is available.'},{title:'Enrichment missing from procedures',plan:'Diverse Learners section: “Early finishers predict what happens if the plant loses its leaves.” Procedures: “Students who finish wait quietly.”',options:['Have early finishers complete a second worksheet.','After students demonstrate the lesson objective, direct them to turn over their paper and explain what would happen if the plant lost its leaves and why.','Give early finishers an unrelated puzzle.'],correct:1,why:'The procedures need the specific extension at the appropriate point, without interfering with classmates’ assessments.'},{title:'Same mastery criterion',plan:'Objective: “Identify the functions of four plant parts with 3/4 correct.” Diverse Learners section: “Students who need extra help only have to identify two parts.”',options:['Keep the lower criterion because it is more supportive.','Remove the mastery criterion for everyone.','Keep the 3/4 criterion and add modeling, visuals, guided practice, or other access points during instruction.'],correct:2,why:'The planned access point supports reaching the same goal; it does not quietly replace the goal.'}];
const mastery=[{title:'Access without lowering the bar',prompt:'Second-grade students must solve at least 3 of 4 two-digit subtraction problems correctly. Which is the strongest plan for diverse learners?',options:['Offer base-ten blocks and a place-value mat during instruction and guided practice; maintain the 3/4 criterion.','Give students who struggle single-digit addition instead and count it as mastery.','Reduce the requirement to 1/4 for students who need support.'],correct:0,hint:'Keep the content and mastery target; change access during learning.'},{title:'Meaningful enrichment',prompt:'Third-grade students can already identify the main idea of a paragraph. Which extension stays with today’s learning?',options:['Ask them to identify the main idea in ten more paragraphs.','Have them compare two plausible main-idea statements and defend the stronger one with text evidence.','Send them to a STEM bin while others finish.'],correct:1,hint:'Look for deeper reasoning about the same content, not extra quantity or unrelated activity.'},{title:'Evidence in procedures',prompt:'A lesson plan says “offer picture cards and sentence frames to everyone,” but neither appears in the teaching steps. What is the best revision?',options:['Assume another teacher will know when to use them.','List the supports again in the Diverse Learners box.','Add a specific modeling/practice step showing when picture cards and optional sentence frames are introduced and used.'],correct:2,hint:'Make the planned support teachable and visible in the procedures.'},{title:'Same story from start to finish',prompt:'The objective is to explain how a seed changes as it grows. The assessment asks for an explanation. The extension says “students can read a dinosaur book.” Which revision best aligns the plan?',options:['Keep the dinosaur book because early finishers need something quiet.','Have students who demonstrate mastery predict how less sunlight could affect seedling growth and explain their reasoning; include the task in procedures.','Give advanced students a longer vocabulary list to copy.'],correct:1,hint:'Extend the same science concept and include it in the instructional sequence.'}];
let code=localStorage.getItem('cued3500_student_code')||'';
function fresh(){return {page:0,accessPick:{},enrichPick:{},repairPick:{},masteryPick:{},mastery:{},feedback:{},draftSupport:'',draftExtend:'',draftCheck:'',metrics:{clicks:0,practiceAttempts:0,masteryAttempts:0,activeSeconds:0,sections:{}}}}
function load(c){let s;try{s=JSON.parse(localStorage.getItem(PREFIX+c))}catch(e){}if(!s||typeof s!=='object')s=fresh();for(const [k,v] of Object.entries(fresh()))s[k]??=v;s.metrics.sections??={};return s}
let state=load(code),lastActive=Date.now(),syncTimer=null;
function valid(){return /^\d{6}$/.test(code)}function save(){if(valid())try{localStorage.setItem(PREFIX+code,JSON.stringify(state))}catch(e){}}
function tick(){let now=Date.now();if(document.visibilityState==='visible')state.metrics.activeSeconds+=Math.max(0,Math.min((now-lastActive)/1000,30));lastActive=now}
function sectionMetric(){return state.metrics.sections[String(state.page+1)]??={clicks:0,practiceAttempts:0,visits:0}}
function track(kind){tick();state.metrics.clicks++;let m=sectionMetric();m.clicks++;if(kind==='practice'){state.metrics.practiceAttempts++;m.practiceAttempts++}if(kind==='mastery')state.metrics.masteryAttempts++;if(kind==='visit')m.visits++;save();schedule()}
function deviceId(){let k='cued3500_device_id',id=localStorage.getItem(k);if(!id){id=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();localStorage.setItem(k,id)}return id}
function send(){if(!valid())return;tick();save();let score=Object.values(state.mastery).filter(Boolean).length;let payload={code,chapter:6,deviceId:deviceId(),updatedAt:new Date().toISOString(),clicks:state.metrics.clicks,practiceAttempts:state.metrics.practiceAttempts,masteryAttempts:state.metrics.masteryAttempts,activeSeconds:Math.round(state.metrics.activeSeconds),sections:state.metrics.sections,score,status:score===4?'Complete':'In progress'};fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),keepalive:true}).then(()=>{document.getElementById('syncStatus').textContent='Progress sent for code '+code+' (receipt not verified).'}).catch(()=>{document.getElementById('syncStatus').textContent='Could not send progress; work remains saved on this browser.'})}
function schedule(){if(!valid())return;clearTimeout(syncTimer);syncTimer=setTimeout(send,1800)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function feedback(key){let f=state.feedback[key];return f?`<div class="feedback ${f.ok?'ok':''}" role="status">${esc(f.text)}</div>`:''}
function options(q,kind,i){let pick=state[kind+'Pick'][i];return `<div class="choices">${q.options.map((o,j)=>`<button class="choice ${pick===j?'selected':''}" data-pick="${kind}:${i}:${j}" aria-pressed="${pick===j}">${esc(o)}</button>`).join('')}</div><button class="primary" data-check="${kind}:${i}" ${kind==='mastery'&&state.mastery[i]?'disabled':''}>${kind==='mastery'&&state.mastery[i]?'Mastered':'Check answer'}</button>${feedback(kind+i)}`}
function intro(){return `<div class="eyebrow">Section 1 · Watch and connect</div><h2>Everyone deserves to learn something new today</h2><p>Some students need additional <strong>access points</strong> to enter and participate in learning. Others are ready to extend what they already know. <strong>Everyone is still expected to master the same lesson objective.</strong></p><figure><img src="assets/access-points.png" alt="Three access routes to one plant-parts learning goal, with the same three-out-of-four mastery expectation"></figure><div class="note"><strong>Access points are not lowered expectations.</strong> A labeled diagram, a model, or guided practice may help students learn the content. The planned objective and mastery criteria remain intact.</div><h3>Watch: How to differentiate without changing the goal</h3><div class="yuja-video" style="margin:18px 0"><iframe title="Instructional video" src="https://tntech.yuja.com/V/Video?v=17690481&amp;node=77367343&amp;a=184776814&amp;preload=false" style="width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#102d44" loading="lazy" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe><p style="font-size:14px">If the embedded player does not appear above, <a href="https://tntech.yuja.com/V/Video?v=17690481&amp;node=77367343&amp;a=184776814&amp;preload=false" target="_blank" rel="noopener noreferrer">watch it directly in YuJa</a>.</p></div><div class="warn"><strong>Your assignment:</strong> Identify a support available to the class and a meaningful extension. Both must appear in your instructional procedures. No additional highlighting is required for Chapter 6.</div>`}
function practiceSection(title,lead,qs,kind){return `<div class="eyebrow">Practice · Make an instructional decision</div><h2>${title}</h2><p>${lead}</p>${qs.map((q,i)=>`<div class="task"><span class="tag">Practice ${i+1}</span><h3>${esc(q.title)}</h3><p>${esc(q.prompt||q.plan)}</p>${options(q,kind,i)}</div>`).join('')}`}
function enrichment(){return `<div class="eyebrow">Section 3 · Extend the concept</div><h2>Enrichment is not more work</h2><p>Enrichment goes <strong>deeper into the same learning</strong>. It is not a reward, extra worksheet, or unrelated activity for students who finish early.</p><figure><img src="assets/enrichment.png" alt="Side-by-side comparison of unrelated or extra work and deeper plant-concept enrichment"></figure>${enrich.map((q,i)=>`<div class="task"><span class="tag">Practice ${i+1}</span><h3>${esc(q.title)}</h3><p>${esc(q.prompt)}</p>${options(q,'enrich',i)}</div>`).join('')}`}
function procedures(){return `<div class="eyebrow">Section 4 · Plan the actual teaching</div><h2>Put it in your procedures</h2><p>Planning a support or extension in a separate box is not enough. Another teacher needs to know <strong>when, where, and how</strong> to use it.</p><div class="sample"><strong>Lesson objective:</strong> Identify the functions of roots, stems, leaves, and flowers with at least 3 of 4 correct.<p><strong>Support in the Diverse Learners section:</strong> Labeled plant diagram and teacher modeling available to all.</p><p><strong>Support in procedures:</strong> During the launch, model the function of each part with a real plant and labeled diagram. During partner practice, leave copies of the diagram available for students who choose to reference them.</p><p><strong>Extension in the Diverse Learners section:</strong> Predict what happens if roots cannot absorb water.</p><p><strong>Extension in procedures:</strong> After students demonstrate mastery, invite them to turn over their papers and explain what would happen if a plant’s roots stopped absorbing water, using what they learned about plant-part functions.</p></div><div class="note">The extension happens after the planned demonstration of mastery and does not interfere with other students still being assessed. If the teacher is busy assessing, students can follow the established extension directions independently.</div><div class="task"><h3>Try it: write the instructional steps</h3><p><strong>New lesson:</strong> Students compare two characters using one similarity and one difference supported by story details. The mastery criterion is 3 out of 4 required elements on the assessment rubric.</p><label for="draftSupport">Write a specific instructional step that offers an access point to everyone.</label><textarea id="draftSupport" placeholder="During the launch/practice, the teacher will..."></textarea><label for="draftExtend">Write a specific instructional step that extends character comparison for students ready to go further.</label><textarea id="draftExtend" placeholder="After demonstrating mastery, students will..."></textarea><button class="primary" id="checkDraft">Check my planning details</button>${feedback('draft')}<p class="small">This check confirms that both instructional steps are present. It does not automatically judge their instructional quality. Compare your writing with the criteria below.</p></div><div class="sample"><strong>Self-check:</strong> Does the support help students reach the <em>same</em> objective? Is it available without singling someone out? Does the extension deepen <em>character comparison</em> rather than adding unrelated work? Are both located in an actual step of the lesson?</div>`}
function repairsSection(){return `<div class="eyebrow">Section 5 · Repair the missing pieces</div><h2>Make the plan tell the same story</h2><p>These plans sound good in the Diverse Learners section, but the instruction doesn't match. Choose the repair that aligns the entire lesson.</p>${repairs.map((q,i)=>`<div class="task"><span class="tag">Repair ${i+1}</span><h3>${esc(q.title)}</h3><div class="sample">${esc(q.plan)}</div><p><strong>Which revision makes the plan coherent?</strong></p>${options(q,'repair',i)}</div>`).join('')}`}
function lab(){let score=Object.values(state.mastery).filter(Boolean).length;return `<div class="eyebrow">Section 6 · Application mastery</div><h2>Diverse Learners Mastery Lab</h2><div class="note"><span class="score">${score}/4</span> mastery points earned. These challenges use new lessons. Retry until you earn all four points.</div>${mastery.map((q,i)=>`<div class="task"><span class="tag">Challenge ${i+1}</span><h3>${esc(q.title)} ${state.mastery[i]?'✓':''}</h3><p>${esc(q.prompt)}</p>${options(q,'mastery',i)}</div>`).join('')}${score===4?'<div class="end"><h3>Chapter 6 mastered: 4/4!</h3><p>Before submitting your lesson plan, check that everyone has access to the same learning goal, that enrichment deepens the same concept, and that both are visible in instructional procedures.</p></div>':''}`}
function render(){let p=state.page;document.getElementById('nav').innerHTML=titles.map((t,i)=>`<button data-nav="${i}" class="${i===p?'active':''}">${i+1}. ${esc(t)}${i===5?' ★':''}</button>`).join('');let score=Object.values(state.mastery).filter(Boolean).length;document.getElementById('progressText').textContent=`Chapter 6 · Section ${p+1} of 6 · Mastery ${score}/4`;document.getElementById('progressBar').style.width=score*25+'%';document.getElementById('content').innerHTML=[intro,()=>practiceSection('Same goal, different access points','Supports can be available to everyone. Students use what they need to learn the intended content; the mastery criterion does not change.',access,'access'),enrichment,procedures,repairsSection,lab][p]();document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(Number(b.dataset.nav)));document.getElementById('prev').disabled=p===0;document.getElementById('prev').onclick=()=>go(Math.max(0,p-1));document.getElementById('next').textContent=p===5?'Return to first section':'Next section →';document.getElementById('next').onclick=()=>go((p+1)%6);wire()}
function go(p){state.page=p;track('visit');render();window.scrollTo(0,0)}
function wire(){document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{let [kind,i,j]=b.dataset.pick.split(':');if(kind==='mastery'&&state.mastery[i])return;state[kind+'Pick'][i]=Number(j);track('click');render()});document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{let [kind,ix]=b.dataset.check.split(':'),i=Number(ix),q=({access,enrich,repair:repairs,mastery})[kind][i],chosen=state[kind+'Pick'][i];if(chosen===undefined){state.feedback[kind+i]={ok:false,text:'Choose an answer before checking.'};track(kind==='mastery'?'mastery':'practice');render();return}let ok=chosen===q.correct;if(kind==='mastery'&&ok)state.mastery[i]=true;state.feedback[kind+i]={ok,text:ok?(kind==='mastery'?'Correct. Mastery point earned. ': 'Correct. ')+(q.why||'The choice preserves the learning goal and aligns instruction.'):kind==='mastery'?q.hint+' Try again.':'Not quite. '+q.why+' Try again.'};track(kind==='mastery'?'mastery':'practice');render()});for(let field of ['draftSupport','draftExtend']){let el=document.getElementById(field);if(el){el.value=state[field];el.oninput=()=>{state[field]=el.value;save();schedule()}}}let chk=document.getElementById('checkDraft');if(chk)chk.onclick=()=>{let ok=state.draftSupport.trim().length>=35&&state.draftExtend.trim().length>=35;state.feedback.draft={ok,text:ok?'Both steps are recorded. Now use the self-check to evaluate their quality and revise your actual lesson plan.':'Write a specific instructional step for BOTH the access point and extension. Include when and how each happens.'};track('practice');render()}}
const input=document.getElementById('studentCode'),status=document.getElementById('syncStatus');input.value=code;
document.getElementById('saveCode').onclick=()=>{let next=input.value.trim();if(!/^\d{6}$/.test(next)){status.textContent='Enter exactly six digits.';return}if(next===code){send();return}if(valid()){tick();save();send()}clearTimeout(syncTimer);code=next;localStorage.setItem('cued3500_student_code',code);state=load(code);lastActive=Date.now();render();status.textContent='Switched to '+code+'. Saved Chapter 6 work restored if present.';send()};
document.getElementById('resetCode').onclick=()=>{if(!valid()){status.textContent='Save a six-digit code first.';return}if(!confirm('Clear Chapter 6 progress on this browser for code '+code+'?'))return;state=fresh();save();render();send();status.textContent='Chapter 6 started fresh for '+code+'.'};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){tick();save();send()}else lastActive=Date.now()});window.addEventListener('pagehide',()=>{tick();save();send()});setInterval(()=>{if(document.visibilityState==='visible'){tick();save();schedule()}},15000);render();if(valid()){track('visit');status.textContent='Student code '+code+' restored.'}else status.textContent='Enter your six-digit code to save and report progress.';
</script></body></html>
