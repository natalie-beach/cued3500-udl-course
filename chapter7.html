<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 7 · Finish Your Lesson Plan</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#183650;background:#f2f7fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(110deg,#0a426e,#187bb5);color:white;padding:25px max(20px,calc((100vw - 1120px)/2))}header h1{margin:5px 0;font-size:clamp(26px,3vw,40px)}header p{margin:0;color:#dcefff}.layout{max-width:1120px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:235px minmax(0,1fr);gap:22px}aside,main{background:white;border:1px solid #dce7f1;border-radius:16px;box-shadow:0 4px 18px #2342a10a}aside{padding:17px;height:max-content;position:sticky;top:12px}main{padding:clamp(18px,3vw,34px)}aside h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:#54718a}nav button{display:block;width:100%;padding:11px;text-align:left;border:0;border-radius:9px;background:transparent;color:#254966;cursor:pointer;font:inherit;font-size:14px;margin:4px 0}nav button.active{background:#e4f2fd;font-weight:700;color:#074f82}h2{font-size:clamp(24px,3vw,32px);margin:8px 0 15px}h3{font-size:19px;margin:12px 0}p,li{line-height:1.55}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#2779a5}.small{font-size:13px;color:#57728a}.note{background:#eaf5ff;border-left:4px solid #2384bc;padding:13px 16px;border-radius:8px;margin:16px 0}.warn{background:#fff4e4;border-left:4px solid #c68a26;padding:13px 16px;border-radius:8px;margin:16px 0}.task{padding:18px;border:1px solid #d6e4f0;border-radius:12px;margin:16px 0}.choices{display:grid;gap:8px;margin:12px 0}.choice{font:inherit;text-align:left;width:100%;padding:12px 13px;background:#f8fbff;border:2px solid #d4e4ef;border-radius:9px;cursor:pointer;color:#183650;line-height:1.45}.choice.selected{border-color:#0874b5;background:#e5f3fd}.feedback{padding:11px 13px;border-radius:8px;background:#fff0dc;color:#7a4a0a;margin:10px 0}.feedback.ok{background:#e4f6e9;color:#14643a}.primary,.secondary{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:11px 16px;font-weight:700}.primary{background:#135f94;color:white}.secondary{background:#e7f0f7;color:#184968}.primary:disabled{opacity:.5;cursor:default}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:28px}input,textarea{width:100%;font:inherit;padding:11px;border:1px solid #afc8d9;border-radius:8px;color:#173650}textarea{min-height:105px;resize:vertical}label{display:block;font-weight:700;margin:14px 0 6px}.progress{height:10px;border-radius:20px;background:#d8e7f1;overflow:hidden;margin:10px 0}.progress div{height:100%;background:#1c9872;width:0}figure{margin:16px 0}figure img{width:100%;border-radius:12px;border:1px solid #dbe6ee}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.tag{border-radius:25px;padding:5px 10px;font-size:12px;font-weight:800;background:#e5f1fc}.sample{background:#f8fbff;border:1px solid #dbe6f1;border-radius:10px;padding:15px;margin:10px 0}.end{background:#e5f5ea;padding:18px;border-radius:10px}.score{font-size:25px;font-weight:800;color:#146a4d}video{width:100%;max-height:450px;background:#0d2b45;border-radius:12px}a{color:#0d6199}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #efa930;outline-offset:2px}@media(max-width:790px){.layout{display:block}aside{position:static;margin-bottom:16px}nav{display:grid;grid-template-columns:1fr 1fr}main{padding:18px}}

.checkline{display:flex;gap:10px;align-items:flex-start;margin:10px 0}.checkline input{width:auto;margin-top:5px}.promptbox{background:#edf6fd;border:1px solid #bfdced;border-radius:10px;padding:16px;white-space:pre-wrap;line-height:1.55}.copy{margin-top:8px}.theorygrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.theorygrid select{width:100%;font:inherit;padding:10px;border:1px solid #afc8d9;border-radius:8px}@media(max-width:650px){.theorygrid{grid-template-columns:1fr}}
</style></head><body><header><div class="eyebrow" style="color:#bde2ff">CUED 3500 · UDL Lesson Planning</div><h1>Chapter 7: Finish Your Lesson Plan</h1><p>Materials, references, misconceptions, and theory. The last pieces of the same lesson.</p></header>
<div class="layout"><aside><h2>Learning path</h2><nav id="nav"></nav><p class="small" id="progressText"></p><div class="progress"><div id="progressBar"></div></div><p class="small">Practice attempts are recorded. Mastery: 4 points, unlimited retries.</p><label for="studentCode">Your six-digit code</label><input id="studentCode" maxlength="6" inputmode="numeric" placeholder="000000"><button class="primary" id="saveCode" style="width:100%;margin-top:8px">Save code / Switch student</button><button class="secondary" id="resetCode" style="width:100%;margin-top:8px">Start fresh for this code</button><p class="small" id="syncStatus" aria-live="polite"></p><p class="small"><a href="index.html">Ch. 1</a> · <a href="chapter2.html">Ch. 2</a> · <a href="chapter3.html">Ch. 3</a> · <a href="chapter4.html">Ch. 4</a> · <a href="chapter5.html">Ch. 5</a> · <a href="chapter6.html">Ch. 6</a></p></aside><main><div id="content"></div><div class="actions"><button id="prev" class="secondary">← Previous</button><button id="next" class="primary">Next section →</button></div></main></div><script>
const ENDPOINT="https://script.google.com/macros/s/AKfycbzIzwQkZEqVtGKF7g3-XSpEajvDp6wRi5hqYjyo5VZ96IGu4vOYJ-N_hjojvgmZaTtH/exec";
const PREFIX='cued3500_ch7_finish_v1_';
const titles=['Four Final Pieces','Materials & Resources','One Misconception','Theorists Flipbook','Final Review & Mastery'];

const theoryNames=['Vygotsky','Bronfenbrenner','Maslow','Bloom','Webb','Dewey','Bruner'];
const theoryScenarios=[
{prompt:'The teacher models a strategy, guides students as they practice, then gradually removes support as students become more independent.',answer:'Vygotsky',why:'Guided learning and scaffolding connect to Vygotsky’s zone of proximal development.'},
{prompt:'Before planning, the teacher considers how home, school, and community circumstances shape students’ opportunities to learn.',answer:'Bronfenbrenner',why:'Bronfenbrenner emphasized interconnected environmental systems.'},
{prompt:'The teacher makes sure students feel physically safe, included, and ready to participate before expecting focused learning.',answer:'Maslow',why:'Maslow’s hierarchy emphasizes foundational needs.'},
{prompt:'The objective moves beyond remembering plant parts: students explain how roots and leaves contribute to a plant’s survival.',answer:'Bloom',why:'Bloom’s taxonomy helps describe cognitive processes, including explaining and analyzing.'},
{prompt:'Students move from identifying facts to explaining relationships and supporting their reasoning with evidence.',answer:'Webb',why:'Webb’s Depth of Knowledge distinguishes levels of cognitive complexity in tasks.'},
{prompt:'Students investigate a real plant, discuss what they notice, and reflect on how their observations connect to the lesson.',answer:'Dewey',why:'Dewey emphasized learning through experience and reflection.'},
{prompt:'Students work with a real plant, then a picture, then scientific words and symbols to represent what they learned.',answer:'Bruner',why:'Bruner described enactive, iconic, and symbolic modes of representation.'}
];
const practice=[
{title:'Material or resource?',prompt:'You will use a set of printed plant-part cards you created yourself. Where should the cards be listed?',options:['Materials, because they are items needed to teach the lesson.','Resources only, because everything printed is a reference.','Neither, because you made them yourself.'],correct:0,why:'List the cards as materials. Cite or acknowledge outside sources if you borrowed the idea, content, or design.'},
{title:'Credit your tools',prompt:'You asked ChatGPT for possible student misconceptions, then checked and revised the suggestions. What should your plan include?',options:['No acknowledgment, because you edited the result.','A brief AI-use acknowledgment describing what the tool helped you do.','ChatGPT listed as the author of your lesson plan.'],correct:1,why:'Acknowledge the assistance accurately. You remain responsible for the instructional decisions.'}
];
const mastery=[
{title:'List what is needed',prompt:'Which materials list is most useful to another teacher who must teach a plant-parts lesson using a real plant, labeled diagram, and response cards?',options:['Things for science','Real plant, labeled plant diagrams, printed response cards, pencils','The state science standards'],correct:1,why:'A materials list names the actual items needed for instruction.'},
{title:'Acknowledge AI',prompt:'A student used AI to brainstorm misconceptions, verified them, and adapted one. Which statement is most accurate?',options:['AI Use: ChatGPT (OpenAI) was used to brainstorm potential student misconceptions. Suggestions were reviewed and adapted for this lesson.','All content was created without outside help.','ChatGPT guarantees the misconception is correct.'],correct:0,why:'The acknowledgment says what AI did and what the student checked.'},
{title:'Head it off in instruction',prompt:'A teacher anticipates that students will think roots take food from soil. Which plan best addresses that misconception?',options:['Write the misconception in the last box but never teach about it.','Wait until students miss it on the final assessment.','During the explanation, explicitly distinguish roots absorbing water from leaves making food, then check students’ explanations.'],correct:2,why:'A proactive step belongs in the instructional procedures, not only in the misconception box.'},
{title:'Connect theory to instruction',prompt:'Which rationale explains a real connection to the lesson rather than just naming a theorist?',options:['I used Bruner because Bruner is a good theorist.','Students handle a real plant, examine a diagram, and explain the parts using vocabulary; this moves from concrete experience to visual and symbolic representations, consistent with Bruner.','I used every theory because all theories are important.'],correct:1,why:'A useful rationale connects a specific instructional choice to a relevant idea.'}
];
const aiPrompt='I am planning a [GRADE] lesson about [SPECIFIC CONCEPT]. My learning objective is [OBJECTIVE]. Suggest five plausible misconceptions children at this grade might have about this specific concept. For each, explain the incorrect belief, why it may seem reasonable to a child, and a brief way to prevent or clarify it during instruction. Do not confuse a misconception with simply not knowing an answer. Do not invent research citations. I will check your suggestions before using them.';
let code=localStorage.getItem('cued3500_student_code')||'';
function fresh(){return {page:0,practicePick:{},masteryPick:{},mastery:{},feedback:{},theoryPick:{},theoryChecked:{},materials:'',references:'',misconception:'',prevention:'',rationale:'',checklist:{},metrics:{clicks:0,practiceAttempts:0,masteryAttempts:0,activeSeconds:0,sections:{}}}}
function load(c){let s;try{s=JSON.parse(localStorage.getItem(PREFIX+c))}catch(e){}if(!s||typeof s!=='object')s=fresh();for(const [k,v] of Object.entries(fresh()))s[k]??=v;s.metrics.sections??={};return s}
let state=load(code),lastActive=Date.now(),syncTimer=null;
function valid(){return /^\d{6}$/.test(code)}
function save(){if(valid())try{localStorage.setItem(PREFIX+code,JSON.stringify(state))}catch(e){}}
function tick(){let now=Date.now();if(document.visibilityState==='visible')state.metrics.activeSeconds+=Math.max(0,Math.min((now-lastActive)/1000,30));lastActive=now}
function sectionMetric(){return state.metrics.sections[String(state.page+1)]??={clicks:0,practiceAttempts:0,visits:0}}
function track(kind){tick();state.metrics.clicks++;let m=sectionMetric();m.clicks++;if(kind==='practice'){state.metrics.practiceAttempts++;m.practiceAttempts++}if(kind==='mastery')state.metrics.masteryAttempts++;if(kind==='visit')m.visits++;save();schedule()}
function deviceId(){let k='cued3500_device_id',id=localStorage.getItem(k);if(!id){id=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();localStorage.setItem(k,id)}return id}
function send(){if(!valid())return;tick();save();let score=Object.values(state.mastery).filter(Boolean).length;let payload={code,chapter:7,deviceId:deviceId(),updatedAt:new Date().toISOString(),clicks:state.metrics.clicks,practiceAttempts:state.metrics.practiceAttempts,masteryAttempts:state.metrics.masteryAttempts,activeSeconds:Math.round(state.metrics.activeSeconds),sections:state.metrics.sections,score,status:score===4?'Complete':'In progress'};fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),keepalive:true}).then(()=>{document.getElementById('syncStatus').textContent='Progress sent for code '+code+' (receipt not verified).'}).catch(()=>{document.getElementById('syncStatus').textContent='Could not send progress; work remains saved on this browser.'})}
function schedule(){if(!valid())return;clearTimeout(syncTimer);syncTimer=setTimeout(send,1800)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]))}
function feedback(key){let f=state.feedback[key];return f?`<div class="feedback ${f.ok?'ok':''}" role="status">${esc(f.text)}</div>`:''}
function options(q,kind,i){let pick=state[kind+'Pick'][i];return `<div class="choices">${q.options.map((o,j)=>`<button class="choice ${pick===j?'selected':''}" data-pick="${kind}:${i}:${j}" aria-pressed="${pick===j}">${esc(o)}</button>`).join('')}</div><button class="primary" data-check="${kind}:${i}" ${kind==='mastery'&&state.mastery[i]?'disabled':''}>${kind==='mastery'&&state.mastery[i]?'Mastered':'Check answer'}</button>${feedback(kind+i)}`}
function intro(){return `<div class="eyebrow">Section 1 · Almost finished</div><h2>Four final pieces. One coherent lesson.</h2><p>You have already planned what students will learn, how you will assess it, how you will teach it, and how you will make learning accessible. Now finish the remaining boxes of your lesson-plan template.</p><div class="sample"><h3>What you will finish</h3><p><strong>Materials:</strong> What does another teacher need to gather?</p><p><strong>Resources/References:</strong> What outside materials, ideas, and tools did you use?</p><p><strong>Misconceptions:</strong> What is ONE likely misunderstanding, and how will your instruction head it off?</p><p><strong>Rationale/Theory:</strong> Which idea from your <strong>Theorists Flipbook</strong> is actually visible in the lesson?</p></div><div class="note"><strong>AI can help you brainstorm. It cannot do your professional thinking for you.</strong> Check its claims, revise its wording, and make sure every suggestion fits your grade, objective, and instructional procedures. You are responsible for what you submit, even if AI wrote the first draft.</div><p>Estimated time: 15–20 minutes. No new video or theory lecture is required.</p>`}
function materials(){return `<div class="eyebrow">Section 2 · Gather and credit</div><h2>Materials & Resources</h2><p><strong>Materials</strong> are the things someone needs to teach your lesson: a real plant, printed cards, pencils, a diagram, or a digital display. <strong>Resources/References</strong> tell where outside ideas, information, activities, or tools came from. An item may belong in both places for different reasons.</p><div class="sample"><strong>Plant lesson example</strong><p><strong>Materials:</strong> real plant, labeled plant-part diagrams, printed response cards, pencils.</p><p><strong>Resources:</strong> state standards website; any textbook, website, or borrowed activity actually used; AI-use acknowledgment when applicable.</p><p><strong>AI Use:</strong> ChatGPT (OpenAI) was used to brainstorm potential student misconceptions. Suggestions were reviewed and adapted for this lesson.</p></div>${practice.map((q,i)=>`<div class="task"><span class="tag">Practice ${i+1}</span><h3>${esc(q.title)}</h3><p>${esc(q.prompt)}</p>${options(q,'practice',i)}</div>`).join('')}<div class="task"><h3>Draft your own lists</h3><label for="materials">Materials needed for my lesson</label><textarea id="materials" placeholder="List specific items, not just 'supplies'..."></textarea><label for="references">Resources and AI-use acknowledgment</label><textarea id="references" placeholder="Include actual sources used and describe any AI assistance..."></textarea><p class="small">These notes stay on this browser under your six-digit code. Transfer them to your actual lesson plan.</p></div>`}
function misconceptions(){return `<div class="eyebrow">Section 3 · Think ahead</div><h2>One misconception. One proactive response.</h2><p>You have not taught this lesson yet, so you cannot know every misunderstanding students will have. You can anticipate a <strong>plausible incorrect belief</strong> and plan to address it before it becomes a problem.</p><div class="sample"><strong>Example: Plant parts</strong><p><strong>Misconception:</strong> Students may believe that roots take food from the soil.</p><p><strong>Head it off:</strong> During instruction, distinguish roots taking in water from leaves making food using light. Ask students to explain the difference before independent practice.</p><p><strong>Where it goes:</strong> Name the misconception and response in the <em>Misconceptions</em> box, AND include the actual teaching move in your <em>Instructional Procedures</em>.</p></div><h3>Use AI to brainstorm, then verify</h3><div class="promptbox">${esc(aiPrompt)}</div><button class="secondary copy" id="copyPrompt">Copy AI prompt</button><div class="warn"><strong>Do not copy and paste without thinking.</strong> AI may suggest something inaccurate, unlikely for your grade, or unrelated to your objective. Reject weak suggestions. Keep just ONE that makes sense and write how your instruction will prevent it.</div><div class="task"><h3>Plan your own misconception</h3><label for="misconception">One likely incorrect belief students might have</label><textarea id="misconception" placeholder="Students may think that..."></textarea><label for="prevention">The specific instructional step that will head it off</label><textarea id="prevention" placeholder="During the launch / modeling / guided practice, I will..."></textarea><button class="primary" id="checkMisconception">Check that I wrote both parts</button>${feedback('misconception')}<p class="small">This check confirms that both boxes contain writing. It cannot judge whether your idea is scientifically accurate or whether your instruction will work. You must check those yourself.</p></div>`}
function theorists(){return `<div class="eyebrow">Section 4 · Apply what you already know</div><h2>Use your Theorists Flipbook</h2><p>You have already studied these theorists and taken the exam. This is a quick reminder, not another theory lesson. Match each classroom decision to the theorist whose ideas best fit it.</p><div class="note">Use the seven theorists from your CUED 3500 exam study guide: Vygotsky, Bronfenbrenner, Maslow, Bloom, Webb, Dewey, and Bruner.</div>${theoryScenarios.map((q,i)=>`<div class="task"><span class="tag">Match ${i+1} of 7</span><p>${esc(q.prompt)}</p><label for="theory${i}">Best match</label><select id="theory${i}" data-theory="${i}"><option value="">Choose a theorist</option>${theoryNames.map(n=>`<option value="${n}" ${state.theoryPick[i]===n?'selected':''}>${n}</option>`).join('')}</select><button class="secondary" style="margin-top:10px" data-theorycheck="${i}">Check match</button>${feedback('theory'+i)}</div>`).join('')}<div class="task"><h3>Write your own rationale</h3><p>Choose a theorist whose idea is <strong>actually present</strong> in your instructional procedures. Your template asks for a few sentences, not a research paper.</p><div class="sample"><strong>Example:</strong> My lesson uses Bruner’s modes of representation when students examine a real plant, study a labeled diagram, and use vocabulary to explain plant-part functions. This moves from concrete experiences to visual and verbal representations.</div><label for="rationale">My rationale/theory statement</label><textarea id="rationale" placeholder="My lesson incorporates... This connects to... because..."></textarea><p class="small">Naming a theorist alone is not a rationale. Explain the specific instructional decision and why it fits.</p></div>`}
function finalSection(){let score=Object.values(state.mastery).filter(Boolean).length;let items=['My materials list names everything needed for the actual procedures.','My references credit the sources I used, including AI assistance when applicable.','I identified ONE realistic misconception and how I will prevent it.','That prevention step appears in my instructional procedures.','My theory rationale connects a theorist from the flipbook to an actual teaching decision.'];return `<div class="eyebrow">Section 5 · Final review</div><h2>Make the last pieces match</h2><p>Use this checklist while looking at your real lesson plan. Checking boxes here does not change the plan itself.</p><div class="task">${items.map((item,i)=>`<label class="checkline" style="font-weight:400"><input type="checkbox" data-finalcheck="${i}" ${state.checklist[i]?'checked':''}><span>${esc(item)}</span></label>`).join('')}</div><h2>Chapter 7 Mastery Lab</h2><div class="note"><span class="score">${score}/4</span> mastery points earned. Choose, check, and retry as needed. The four questions check your decisions, not the quality of your written lesson plan.</div>${mastery.map((q,i)=>`<div class="task"><span class="tag">Challenge ${i+1}</span><h3>${esc(q.title)} ${state.mastery[i]?'✓':''}</h3><p>${esc(q.prompt)}</p>${options(q,'mastery',i)}</div>`).join('')}${score===4?'<div class="end"><h3>Chapter 7 mastered: 4/4!</h3><p>You have completed the final instructional module. Before submitting, transfer your writing to the actual lesson plan and check that the procedures include the misconception-prevention step.</p></div>':''}`}
const pages=[intro,materials,misconceptions,theorists,finalSection];
function render(){let p=state.page;document.getElementById('nav').innerHTML=titles.map((t,i)=>`<button data-nav="${i}" class="${i===p?'active':''}">${i+1}. ${esc(t)}${i===4?' ★':''}</button>`).join('');let score=Object.values(state.mastery).filter(Boolean).length;document.getElementById('progressText').textContent=`Chapter 7 · Section ${p+1} of 5 · Mastery ${score}/4`;document.getElementById('progressBar').style.width=score*25+'%';document.getElementById('content').innerHTML=pages[p]();document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(Number(b.dataset.nav)));document.getElementById('prev').disabled=p===0;document.getElementById('prev').onclick=()=>go(Math.max(0,p-1));document.getElementById('next').textContent=p===4?'Return to first section':'Next section →';document.getElementById('next').onclick=()=>go((p+1)%5);wire()}
function go(p){state.page=p;track('visit');render();window.scrollTo(0,0)}
function wire(){document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{let [kind,i,j]=b.dataset.pick.split(':');if(kind==='mastery'&&state.mastery[i])return;state[kind+'Pick'][i]=Number(j);track('click');render()});document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{let [kind,ix]=b.dataset.check.split(':'),i=Number(ix),q=({practice,mastery})[kind][i],chosen=state[kind+'Pick'][i];if(chosen===undefined){state.feedback[kind+i]={ok:false,text:'Choose an answer before checking.'};track(kind==='mastery'?'mastery':'practice');render();return}let ok=chosen===q.correct;if(kind==='mastery'&&ok)state.mastery[i]=true;state.feedback[kind+i]={ok,text:ok?(kind==='mastery'?'Correct. Mastery point earned. ':'Correct. ')+q.why:'Not quite. '+(kind==='mastery'?'Review the example and try again.':q.why+' Try again.')};track(kind==='mastery'?'mastery':'practice');render()});document.querySelectorAll('[data-theory]').forEach(el=>el.onchange=()=>{state.theoryPick[el.dataset.theory]=el.value;save();schedule()});document.querySelectorAll('[data-theorycheck]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.theorycheck),q=theoryScenarios[i],pick=state.theoryPick[i],ok=pick===q.answer;state.feedback['theory'+i]={ok,text:!pick?'Choose a theorist first.':ok?'Correct. '+q.why:'Try again. Think about the central idea in the classroom decision.'};track('practice');render()});for(let field of ['materials','references','misconception','prevention','rationale']){let el=document.getElementById(field);if(el){el.value=state[field];el.oninput=()=>{state[field]=el.value;save();schedule()}}}let copy=document.getElementById('copyPrompt');if(copy)copy.onclick=async()=>{try{await navigator.clipboard.writeText(aiPrompt);copy.textContent='Copied!'}catch(e){copy.textContent='Select and copy the prompt above.'}};let check=document.getElementById('checkMisconception');if(check)check.onclick=()=>{let ok=state.misconception.trim().length>=25&&state.prevention.trim().length>=35;state.feedback.misconception={ok,text:ok?'Both parts are written. Now check accuracy and add the prevention step to your actual instructional procedures.':'Write both a specific incorrect belief and a specific instructional step that prevents or clarifies it.'};track('practice');render()};document.querySelectorAll('[data-finalcheck]').forEach(el=>el.onchange=()=>{state.checklist[el.dataset.finalcheck]=el.checked;track('click')})}
const input=document.getElementById('studentCode'),status=document.getElementById('syncStatus');input.value=code;
document.getElementById('saveCode').onclick=()=>{let next=input.value.trim();if(!/^\d{6}$/.test(next)){status.textContent='Enter exactly six digits.';return}if(next===code){send();return}if(valid()){tick();save();send()}clearTimeout(syncTimer);code=next;localStorage.setItem('cued3500_student_code',code);state=load(code);lastActive=Date.now();render();status.textContent='Switched to '+code+'. Saved Chapter 7 work restored if present.';send()};
document.getElementById('resetCode').onclick=()=>{if(!valid()){status.textContent='Save a six-digit code first.';return}if(!confirm('Clear Chapter 7 progress on this browser for code '+code+'?'))return;state=fresh();save();render();send();status.textContent='Chapter 7 started fresh for '+code+'.'};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){tick();save();send()}else lastActive=Date.now()});window.addEventListener('pagehide',()=>{tick();save();send()});setInterval(()=>{if(document.visibilityState==='visible'){tick();save();schedule()}},15000);render();if(valid()){track('visit');status.textContent='Student code '+code+' restored.'}else status.textContent='Enter your six-digit code to save and report progress.';
</script></body></html>
