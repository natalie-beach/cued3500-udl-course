<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CUED 3500 | Chapter 3: Language Demands</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17334f;background:#f3f7fc}*{box-sizing:border-box}body{margin:0}header{background:#123758;color:white;padding:24px max(24px,calc((100vw - 1120px)/2))}header h1{font-size:clamp(26px,3vw,39px);margin:6px 0}header p{margin:0;color:#d6e7f7}.layout{max-width:1120px;margin:24px auto;padding:0 18px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px}aside,.panel{background:white;border:1px solid #dce6f2;border-radius:17px;box-shadow:0 5px 20px #183c5c0a}aside{padding:18px;height:max-content;position:sticky;top:16px}aside h2{font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:#637c92}nav button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:12px 10px;color:#26435e;cursor:pointer;font:inherit;font-size:14px;margin:4px 0}nav button.active{background:#e5f0fb;color:#0b457b;font-weight:700}nav button:hover{background:#f0f6fc}.panel{padding:clamp(18px,3vw,36px)}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;color:#39719b;text-transform:uppercase}h2{font-size:clamp(23px,3vw,32px);margin:10px 0 14px}h3{font-size:19px;margin:24px 0 8px}p{line-height:1.65}figure{margin:22px 0}figure img{width:100%;height:auto;border-radius:12px;border:1px solid #dbe7f3}figcaption{font-size:13px;color:#5c7185;margin-top:8px}video{display:block;width:100%;background:#081b2e;border-radius:12px;margin:18px 0}.note{background:#eff6fd;border-left:4px solid #3979b4;padding:13px 17px;border-radius:6px;margin:16px 0;line-height:1.55}.warn{background:#fff5e6;border-left:4px solid #c78828;padding:12px 15px;border-radius:8px;margin:16px 0}.task{border:1px solid #d7e4f1;border-radius:14px;padding:20px;margin:20px 0;background:#fff}.task h3{margin:0 0 12px}.chips{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.chip,.choice{background:#f8fbff;border:2px solid #d5e3f0;border-radius:10px;padding:12px;cursor:pointer;text-align:left;color:#183c59;font:inherit}.chip.selected,.choice.selected{border-color:#186da7;background:#e5f3ff}.chip:focus-visible,.choice:focus-visible,button:focus-visible{outline:3px solid #e6a642}.card-list{display:grid;gap:10px}.choice{display:block;width:100%}.choice:disabled{cursor:default;opacity:.75}.mini{font-size:13px;color:#5b7489}.objective{background:#e8f2fb;border-left:5px solid #1b639a;padding:16px 20px;border-radius:10px;margin:18px 0}.objective p{margin:6px 0}.actions,.task-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:25px;flex-wrap:wrap}.task-tools{justify-content:flex-start}button.primary{background:#164b77;color:white;border:0;border-radius:10px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer}button.primary:disabled{opacity:.5;cursor:not-allowed}button.secondary{background:#e9f1f8;border:0;border-radius:10px;padding:12px 18px;font:inherit;color:#18466b;cursor:pointer}.progress{height:9px;background:#dce8f3;border-radius:99px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:#27856b;transition:width .2s}.small{font-size:13px;color:#637b91}.feedback{padding:12px;border-radius:9px;background:#fff2df;margin:12px 0;color:#68430e}.feedback.correct{background:#e5f5eb;color:#175d38}.tag{display:inline-block;background:#dbeafa;border-radius:50px;padding:4px 10px;font-size:12px;font-weight:700}.mastery-count{font-size:22px;font-weight:800;color:#176d54}.end{padding:18px;background:#e8f7ee;border-radius:12px}.field{display:block;width:100%;padding:12px;border:1px solid #b9cce0;border-radius:9px;font:inherit;color:#17334f}.label{display:block;font-weight:700;margin:14px 0 6px}.sentence{background:#f0f8ff;padding:15px;border-radius:10px;line-height:1.7;font-weight:600}.examples{display:grid;grid-template-columns:1fr 1fr;gap:12px}.example{border:1px solid #dce6f2;padding:16px;border-radius:12px;background:#f9fcff}.example h3{margin:0 0 10px}.word-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.word-row>div{background:#f5f9fe;padding:12px;border-radius:9px}.checklist{line-height:1.8}input[type=text]{max-width:100%}@media(max-width:800px){.layout{display:block}aside{position:static;margin-bottom:18px}nav{display:grid;grid-template-columns:repeat(2,1fr)}.panel{padding:18px}.examples,.word-row{grid-template-columns:1fr}}
</style></head><body><header><div class="eyebrow" style="color:#a8cbe7">CUED 3500 · UDL Lesson Planning</div><h1>Chapter 3: Language Demands</h1><p>One Language Function · Meaningful Vocabulary · Child-Friendly Definitions</p></header><div class="layout"><aside><h2>Your learning path</h2><nav id="nav"></nav><div class="small" id="progressText"></div><div class="progress"><div id="progressBar"></div></div><p class="small">Learn, practice, and retry the four mastery challenges until you earn 4/4.</p><div style="margin-top:14px"><label for="studentCode"><strong>Your six-digit code</strong></label><input id="studentCode" class="field" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="000000" style="margin:8px 0"><button class="primary" id="saveCode" style="width:100%">Save code / Switch student</button><button class="secondary" id="resetCode" style="width:100%;margin-top:8px">Start fresh for this code</button><p class="small" id="syncStatus" aria-live="polite">Enter your code to record progress.</p><p class="small"><a href="index.html">← Chapter 1</a> · <a href="chapter2.html">Chapter 2</a></p></div></aside><main class="panel"><div id="content"></div><div class="actions"><button class="secondary" id="prev">← Previous</button><button class="primary" id="next">Next section →</button></div></main></div><script>
const ENDPOINT='https://script.google.com/macros/s/AKfycbzIzwQkZEqVtGKF7g3-XSpEajvDp6wRi5hqYjyo5VZ96IGu4vOYJ-N_hjojvgmZaTtH/exec';
const PREFIX='cued3500_ch3_interactive_v1_';
const titles=['Learn: Language Functions','Choose One Function','Write the Statement','Vocabulary That Children Can Say','Put It Together','Mastery Lab'];
const functionCases=[{objective:'Students will identify one similarity and one difference between two habitats.',options:['Describe','Compare','Explain'],correct:1,why:'Students communicate how two habitats are alike and different.'},{objective:'Students will tell why a shadow changes length during the day.',options:['Explain','Describe','Compare'],correct:0,why:'Students must communicate why a change happens.'},{objective:'Students will name and tell the features of three geometric shapes.',options:['Compare','Explain','Describe'],correct:2,why:'Students communicate the features of each shape.'}];
const vocabCases=[{word:'Roots',options:['Structures that absorb water and anchor a plant.','The underground parts of a plant that suck up water and hold it in the soil.','The things that make plants grow.'],correct:1,why:'It is understandable, repeatable, and accurate for an early elementary plant lesson.'},{word:'Compare',options:['Tell how two things are alike and different.','Identify similarities and differences among multiple entities.','Tell what two things are called.'],correct:0,why:'It uses familiar language without losing the meaning.'},{word:'Evaporation',options:['Water disappears forever.','The process of liquid changing into vapor.','When liquid water turns into a gas and goes into the air.'],correct:2,why:'It is child-friendly and avoids the inaccurate idea that water vanishes.'}];
const mastery=[{title:'Choose the function that fits',prompt:'Objective: Students will tell how two characters respond differently to the same problem. Which ONE function fits the expected response?',options:['Describe','Compare','Explain'],correct:1,hint:'They must communicate a difference between two characters.'},{title:'Finish the complete language statement',prompt:'Objective: Students will explain how roots and stems help a plant. Which statement includes ONE function, specific content, and an observable “by” clause?',options:['Students will explain, describe, and compare plants.','Students will explain how roots and stems help a plant by telling what each part does with water.','Students will understand plant parts by learning about them.'],correct:1,hint:'Look for exactly one function and a specific action after “by.”'},{title:'Select a student-friendly definition',prompt:'For an early elementary lesson, which definition of “stem” is accurate and repeatable?',options:['A vascular structure that transports materials through a plant.','The part that holds the plant up and moves water to its leaves.','The green thing that is always tall.'],correct:1,hint:'Choose a definition that is both understandable and correct for this lesson.'},{title:'Repair an AI suggestion',prompt:'Objective: Students will describe the features of three shapes. AI suggests: “Students will compare, explain, and describe shapes by writing a paragraph about why they are different.” Which revision best fits this first lesson plan?',options:['Students will describe three shapes by naming the sides and corners of each.','Students will compare and describe three shapes by writing a report.','Students will explain why all shapes look the way they do.'],correct:0,hint:'Use only one permitted function, match the objective, and do not add an unrelated writing task.'}];
let code=localStorage.getItem('cued3500_student_code')||'';
function fresh(){return {page:0,functions:{},functionPick:{},vocab:{},vocabPick:{},sentence:{fn:'',content:'',by:''},draft:{},mastery:{},masteryPick:{},feedback:{},metrics:{clicks:0,practiceAttempts:0,masteryAttempts:0,activeSeconds:0,sections:{}}}}
function load(c){let s;try{s=JSON.parse(localStorage.getItem(PREFIX+c))}catch(e){};if(!s||typeof s!=='object')s=fresh();let f=fresh();for(let k of Object.keys(f))s[k]??=f[k];s.metrics.sections??={};return s}
let state=load(code),lastActive=Date.now(),syncTimer=null;
function valid(){return /^\d{6}$/.test(code)}
function save(){if(valid())try{localStorage.setItem(PREFIX+code,JSON.stringify(state))}catch(e){}}
function sectionMetric(){let k=String(state.page+1);return state.metrics.sections[k]??={clicks:0,practiceAttempts:0,visits:0}}
function tick(){let now=Date.now();if(document.visibilityState==='visible')state.metrics.activeSeconds+=Math.max(0,Math.min((now-lastActive)/1000,30));lastActive=now}
function track(kind){tick();state.metrics.clicks++;let m=sectionMetric();m.clicks++;if(kind==='practice'){state.metrics.practiceAttempts++;m.practiceAttempts++}if(kind==='mastery')state.metrics.masteryAttempts++;if(kind==='visit')m.visits++;save();schedule()}
function deviceId(){let k='cued3500_device_id',id=localStorage.getItem(k);if(!id){id=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();localStorage.setItem(k,id)}return id}
function send(){if(!valid())return;tick();save();const score=Object.values(state.mastery).filter(Boolean).length;const payload={code,chapter:3,deviceId:deviceId(),updatedAt:new Date().toISOString(),clicks:state.metrics.clicks,practiceAttempts:state.metrics.practiceAttempts,masteryAttempts:state.metrics.masteryAttempts,activeSeconds:Math.round(state.metrics.activeSeconds),sections:state.metrics.sections,score,status:score===4?'Complete':'In progress'};fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),keepalive:true}).then(()=>{document.getElementById('syncStatus').textContent='Progress sent for code '+code+' (receipt not verified).'}).catch(()=>{document.getElementById('syncStatus').textContent='Could not send progress; answers remain saved here.'})}
function schedule(){if(!valid())return;clearTimeout(syncTimer);syncTimer=setTimeout(send,1800)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function feedback(k){let f=state.feedback[k];return f?`<div class="feedback ${f.ok?'correct':''}" role="status">${esc(f.text)}</div>`:''}
function image(src,alt,caption){return `<figure><img src="assets/${src}" alt="${esc(alt)}" loading="lazy"><figcaption>${esc(caption)}</figcaption></figure>`}
function choiceSet(options,selected,attr){return `<div class="card-list">${options.map((v,j)=>`<button type="button" class="choice ${selected===j?'selected':''}" ${attr}="${j}">${esc(v)}</button>`).join('')}</div>`}
function intro(){return `<div class="eyebrow">Section 1 · New instruction</div><h2>What language do children need to show what they know?</h2><p>You've already planned what students will learn and how you'll assess it. Now think about the <strong>language they need to communicate their learning</strong>.</p><div class="note"><strong>For this first CUED 3500 lesson plan:</strong> choose exactly <strong>ONE</strong> language function: <strong>compare, explain, OR describe</strong>. These are training wheels for this assignment, not the only functions teachers use.</div><div class="yuja-video" style="margin:18px 0"><iframe title="Language Functions" src="https://tntech.yuja.com/V/Video?v=17690491&amp;node=77367364&amp;a=76941901&amp;preload=false" style="width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#102d44" loading="lazy" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe><p style="font-size:14px">If the video does not appear above, <a href="https://tntech.yuja.com/V/Video?v=17690491&amp;node=77367364&amp;a=76941901&amp;preload=false" target="_blank" rel="noopener noreferrer">watch it directly in YuJa</a>.</p></div><p class="mini">Watch the language-functions lesson, then use the decision graphic as a reference.</p>${image('language-function-choices.png','Decision graphic: Compare means alike and different; explain means how or why; describe means features and characteristics.','The function follows the objective and what students will communicate.') }<div class="note"><strong>Looking ahead:</strong> In ESL coursework, you will learn to write language objectives and plan more detailed language supports. Multilingual learners may know content before they can express it easily in English. Students with disabilities may also have different communication and language abilities. Choosing a clear language function helps you plan ways for children to show learning through speech, writing, signing, AAC, pointing, or other appropriate responses. The goal is access to the same content, not a lower expectation.</div>`}
function functions(){return `<div class="eyebrow">Section 2 · Practice</div><h2>Choose ONE function based on the objective</h2><p>The topic alone doesn't determine the function. A plant lesson might ask students to <strong>describe</strong> parts or <strong>explain</strong> how they work. What children must demonstrate makes the difference.</p>${functionCases.map((q,i)=>`<div class="task"><span class="tag">Decision ${i+1}</span><h3>What language will students use?</h3><div class="objective">${esc(q.objective)}</div>${choiceSet(q.options,state.functionPick[i],'data-fpick="'+i+'" data-choice')}<div class="task-tools"><button class="primary" data-fcheck="${i}">Check my choice</button></div>${feedback('f'+i)}</div>`).join('')}<div class="warn"><strong>AI guardrail:</strong> If AI suggests three functions, don't copy all three. Read the objective, decide what children will actually communicate, and choose just one.</div>`}
function sentence(){let s=state.sentence;let composed=`Students will ${s.fn||'[choose a function]'} ${s.content||'[specific content]'} by ${s.by||'[how they will communicate]'}.`;return `<div class="eyebrow">Section 3 · Build and revise</div><h2>Write one complete “Students will… by…” statement</h2>${image('complete-language-statement.png','Visual sentence model showing students will plus one function plus content plus by plus observable language task.','The “by” clause names what children will actually do to communicate learning.')}<div class="objective"><strong>Practice objective:</strong><p>Students will explain how roots and stems help a plant survive.</p></div><div class="task"><h3>Build your own statement</h3><p>Use this objective. Choose one function, name the content, and write an observable “by” clause. This is guided writing practice, not an automatically graded answer.</p><label class="label" for="fn">One language function</label><select id="fn" class="field"><option value="">Choose one</option>${['compare','explain','describe'].map(v=>`<option value="${v}" ${s.fn===v?'selected':''}>${v}</option>`).join('')}</select><label class="label" for="contentPart">Specific content (after the function)</label><input id="contentPart" class="field" type="text" value="${esc(s.content)}" placeholder="how roots and stems help a plant"><label class="label" for="byPart">How children will communicate (after “by”)</label><input id="byPart" class="field" type="text" value="${esc(s.by)}" placeholder="telling what each part does with water"><h3>Your complete statement</h3><div class="sentence" id="sentencePreview">${esc(composed)}</div><div class="task-tools"><button class="primary" id="sentenceCheck">Check my statement</button></div>${feedback('sentence')}</div><div class="note"><strong>Teacher check:</strong> Is it one sentence? Exactly one function? Does the content match the objective? Does “by” name an observable way to communicate? Does the assessment actually allow that response?</div>`}
function vocabulary(){return `<div class="eyebrow">Section 4 · Vocabulary instruction and practice</div><h2>Vocabulary children can understand, repeat, and use</h2><p>Your lesson plan lists <strong>essential words or symbols you will teach</strong>, with definitions appropriate for the grade and this specific lesson. There is <strong>no required word count</strong>. Don't list every word in the activity.</p>${image('student-friendly-vocabulary.png','Student-friendly vocabulary graphic with roots, stem, compare and evaporation definitions.','A student-friendly definition is not just a shortened dictionary definition.')}<div class="note"><strong>Important:</strong> You write the definitions in your lesson plan so you can teach and revisit them. Elementary students should be able to <strong>say and use</strong> the definitions; they should not be assigned to copy them.</div>${vocabCases.map((q,i)=>`<div class="task"><span class="tag">Definition repair ${i+1}</span><h3>Which definition would you teach for “${esc(q.word)}”?</h3>${choiceSet(q.options,state.vocabPick[i],'data-vpick="'+i+'" data-choice')}<div class="task-tools"><button class="primary" data-vcheck="${i}">Check definition</button></div>${feedback('v'+i)}</div>`).join('')}<div class="warn">Avoid definitions that are too academic, too vague, or inaccurate. “Correct for the grade and lesson” does not mean including every technical exception.</div>`}
function together(){let d=state.draft;return `<div class="eyebrow">Section 5 · Apply to your lesson plan</div><h2>What a strong Language Demands section looks like</h2><p>These are examples of <strong>just this section</strong> of a lesson plan. Notice the alignment between the objective, vocabulary, and one language-function statement.</p><div class="examples"><div class="example"><h3>Example A · Science</h3><p><strong>Objective:</strong> Students will describe what roots, stems, and leaves do for a plant.</p><p><strong>Vocabulary taught:</strong></p><p><strong>Roots:</strong> The underground parts of a plant that suck up water and hold it in the soil.</p><p><strong>Stem:</strong> The part that holds the plant up and moves water to its leaves.</p><p><strong>Leaves:</strong> The parts that use sunlight to help the plant make food.</p><p><strong>ONE function:</strong> Students will <strong>describe</strong> what roots, stems, and leaves do <strong>by</strong> pointing to each part on a picture and telling its job.</p></div><div class="example"><h3>Example B · Reading</h3><p><strong>Objective:</strong> Students will compare how two characters respond to a problem using story details.</p><p><strong>Vocabulary taught:</strong></p><p><strong>Character:</strong> A person or animal in a story.</p><p><strong>Compare:</strong> Tell how two things are alike and different.</p><p><strong>Story detail:</strong> Something the story tells or shows us.</p><p><strong>ONE function:</strong> Students will <strong>compare</strong> two characters' actions <strong>by</strong> telling one similarity and one difference using details from the story.</p></div></div><div class="task"><h3>Draft your own Language Demands section</h3><p class="mini">This is a private working draft saved on this browser for your six-digit code. It is not submitted or sent to the instructor's Google Sheet.</p><label class="label" for="myobjective">My lesson objective</label><textarea id="myobjective" class="field" rows="2" placeholder="What must children demonstrate?">${esc(d.objective)}</textarea><label class="label" for="myvocab">Essential vocabulary/symbols and student-friendly definitions</label><textarea id="myvocab" class="field" rows="4" placeholder="Word: A short, grade-appropriate definition children can say...">${esc(d.vocab)}</textarea><label class="label" for="myfunction">My ONE complete language-function statement</label><textarea id="myfunction" class="field" rows="3" placeholder="Students will ... by ...">${esc(d.function)}</textarea><div class="task-tools"><button class="primary" id="copyDraft">Copy my draft</button><button class="secondary" id="draftCheck">Review my checklist</button></div>${feedback('draft')}</div><div class="note"><strong>Before submitting:</strong> The vocabulary is what you will teach, not what children must copy. The language statement uses one of the three functions, is a complete sentence, and matches what the lesson objective and assessment require.</div>`}
function lab(){let score=Object.values(state.mastery).filter(Boolean).length;return `<div class="eyebrow">Section 6 · Four mastery points</div><h2>Language Demands Mastery Lab</h2><p>Apply what you've learned in four new decisions. Incorrect answers include hints. Retry without losing earned points.</p><div class="note"><span class="mastery-count">${score}/4</span> mastery points earned</div>${mastery.map((q,i)=>{let done=!!state.mastery[i];return `<div class="task"><span class="tag">Challenge ${i+1}</span><h3>${esc(q.title)} ${done?'✓':''}</h3><p>${esc(q.prompt)}</p>${choiceSet(q.options,state.masteryPick[i],'data-mpick="'+i+'" data-choice')}<div class="task-tools"><button class="primary" data-mcheck="${i}" ${done?'disabled':''}>${done?'Mastered':'Check challenge'}</button></div>${feedback('m'+i)}</div>`}).join('')}${score===4?'<div class="end"><strong>Chapter 3 mastered: 4/4!</strong><p>Use the examples and your draft to complete the Language Demands section of your UDL lesson plan.</p></div>':''}`}
function render(){let p=state.page;document.getElementById('nav').innerHTML=titles.map((t,i)=>`<button data-nav="${i}" class="${i===p?'active':''}">${i+1}. ${esc(t)} ${i===5?'★':''}</button>`).join('');let score=Object.values(state.mastery).filter(Boolean).length;document.getElementById('progressText').textContent=`Chapter 3: section ${p+1} of 6 · Mastery ${score}/4`;document.getElementById('progressBar').style.width=score*25+'%';document.getElementById('content').innerHTML=[intro,functions,sentence,vocabulary,together,lab][p]();document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(Number(b.dataset.nav)));document.getElementById('prev').disabled=p===0;document.getElementById('prev').onclick=()=>go(Math.max(0,p-1));document.getElementById('next').textContent=p===5?'Return to first section':'Next section →';document.getElementById('next').onclick=()=>go((p+1)%6);wire()}
function go(n){state.page=n;track('visit');render();window.scrollTo(0,0)}
function respond(k,ok,yes,no){state.feedback[k]={ok,text:ok?yes:no};track('practice');render()}
function wire(){document.querySelectorAll('[data-fpick]').forEach(b=>b.onclick=()=>{state.functionPick[b.dataset.fpick]=Number(b.dataset.choice);state.feedback['f'+b.dataset.fpick]=null;track('click');render()});document.querySelectorAll('[data-fcheck]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.fcheck),q=functionCases[i],v=state.functionPick[i];respond('f'+i,v===q.correct,q.why,v===undefined?'Choose a function first.':'Read the objective and ask whether students are communicating similarities, reasons, or features.')});document.querySelectorAll('[data-vpick]').forEach(b=>b.onclick=()=>{state.vocabPick[b.dataset.vpick]=Number(b.dataset.choice);state.feedback['v'+b.dataset.vpick]=null;track('click');render()});document.querySelectorAll('[data-vcheck]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.vcheck),q=vocabCases[i],v=state.vocabPick[i];respond('v'+i,v===q.correct,q.why,v===undefined?'Choose a definition first.':'Check accuracy and whether a young child could say it back.')});for(let [id,k] of [['fn','fn'],['contentPart','content'],['byPart','by']]){let el=document.getElementById(id);if(el)el.oninput=()=>{state.sentence[k]=el.value;let s=state.sentence;document.getElementById('sentencePreview').textContent=`Students will ${s.fn||'[choose a function]'} ${s.content||'[specific content]'} by ${s.by||'[how they will communicate]'}.`;track('click')}}let sentenceCheck=document.getElementById('sentenceCheck');if(sentenceCheck)sentenceCheck.onclick=()=>{let s=state.sentence;let ok=s.fn==='explain'&&s.content.trim().length>=12&&s.by.trim().length>=12&&!/\b(compare|describe)\b/i.test(s.content+' '+s.by);state.feedback.sentence={ok,text:ok?'Your draft includes the matching function and both sentence parts. Now check that the “by” clause names an observable response and matches your assessment. This writing has not been automatically evaluated for meaning.':'For this objective, choose explain. Name how roots and stems help a plant, then complete “by” with something children can actually communicate. The form checks structure only, not the quality of your writing.'};track('practice');render()};for(let [id,k] of [['myobjective','objective'],['myvocab','vocab'],['myfunction','function']]){let el=document.getElementById(id);if(el)el.oninput=()=>{state.draft[k]=el.value;track('click')}}let copy=document.getElementById('copyDraft');if(copy)copy.onclick=()=>{let d=state.draft;let txt=`Objective:\n${d.objective||''}\n\nContent vocabulary/symbols and kid-friendly definitions:\n${d.vocab||''}\n\nLanguage function:\n${d.function||''}`;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>{state.feedback.draft={ok:true,text:'Draft copied. Paste it into your working lesson plan and review it before submitting.'};render()}).catch(()=>{state.feedback.draft={ok:false,text:'Copy was blocked. Select and copy your draft text manually.'};render()});else{state.feedback.draft={ok:false,text:'Clipboard unavailable. Select and copy your draft text manually.'};render()}};let draftCheck=document.getElementById('draftCheck');if(draftCheck)draftCheck.onclick=()=>{let d=state.draft;let fn=d.function||'';let fns=['compare','explain','describe'].filter(w=>new RegExp('\\b'+w+'\\b','i').test(fn));let ok=!!d.objective?.trim()&&!!d.vocab?.trim()&&/^students will\b/i.test(fn.trim())&&/\bby\b/i.test(fn)&&fns.length===1;state.feedback.draft={ok,text:ok?'Structure check passed: objective, vocabulary, and a “Students will…by…” statement with one permitted function are present. You must still judge alignment, accuracy, and child-friendliness yourself.':'Check that you included your objective, essential vocabulary with definitions, and ONE complete statement starting “Students will…” with a “by…” clause. This is a structure check, not automatic grading.'};track('practice');render()};document.querySelectorAll('[data-mpick]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.mpick);if(state.mastery[i])return;state.masteryPick[i]=Number(b.dataset.choice);state.feedback['m'+i]=null;track('click');render()});document.querySelectorAll('[data-mcheck]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.mcheck),q=mastery[i],v=state.masteryPick[i];if(v===q.correct)state.mastery[i]=true;state.feedback['m'+i]={ok:v===q.correct,text:v===q.correct?'Correct. Mastery point earned.':v===undefined?'Select an answer first.':q.hint+' Try again.'};track('mastery');render()})}
