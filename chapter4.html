<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CUED 3500 · Chapter 4 · UDL Implementation</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17334f;background:#f3f7fc}*{box-sizing:border-box}body{margin:0}header{background:#123758;color:white;padding:25px max(24px,calc((100vw - 1120px)/2))}header h1{font-size:clamp(25px,3vw,39px);margin:6px 0}header p{margin:0;color:#d6e7f7}.layout{max-width:1120px;margin:24px auto;padding:0 18px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px}aside,.panel{background:white;border:1px solid #dce6f2;border-radius:17px;box-shadow:0 5px 20px #183c5c0a}aside{padding:18px;height:max-content;position:sticky;top:16px}aside h2{font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:#637c92}nav button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:12px 10px;color:#26435e;cursor:pointer;font:inherit;font-size:14px;margin:4px 0}nav button.active{background:#e5f0fb;color:#0b457b;font-weight:700}.panel{padding:clamp(18px,3vw,36px)}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;color:#39719b;text-transform:uppercase}h2{font-size:clamp(23px,3vw,32px);margin:10px 0 14px}h3{font-size:19px;margin:22px 0 8px}p{line-height:1.6}a{color:#125b91}figure{margin:18px 0}figure img{width:100%;height:auto;border-radius:12px;border:1px solid #dbe7f3}figcaption{font-size:13px;color:#5c7185;margin-top:7px}.note{background:#eff6fd;border-left:4px solid #3979b4;padding:13px 17px;border-radius:6px;margin:16px 0;line-height:1.55}.warn{background:#fff5e6;border-left:4px solid #c78828;padding:12px 15px;border-radius:8px;margin:16px 0}.task{border:1px solid #d7e4f1;border-radius:14px;padding:20px;margin:20px 0;background:#fff}.task h3{margin:0 0 12px}.choices{display:grid;gap:10px;margin:12px 0}.choice,.sentence-button{background:#f8fbff;border:2px solid #d5e3f0;border-radius:10px;padding:12px;cursor:pointer;text-align:left;color:#183c59;font:inherit;width:100%;line-height:1.5}.choice.selected,.sentence-button.selected{border-color:#186da7;background:#e5f3ff}.sentence-button.highlighted{background:#fff0a4;border-color:#c7961e}.choice:focus-visible,.sentence-button:focus-visible,button:focus-visible{outline:3px solid #e6a642}.actions,.task-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:25px;flex-wrap:wrap}.task-tools{justify-content:flex-start}button.primary{background:#164b77;color:white;border:0;border-radius:10px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer}button.primary:disabled{opacity:.5;cursor:not-allowed}button.secondary{background:#e9f1f8;border:0;border-radius:10px;padding:12px 18px;font:inherit;color:#18466b;cursor:pointer}.progress{height:9px;background:#dce8f3;border-radius:99px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:#27856b}.small{font-size:13px;color:#637b91}.feedback{padding:12px;border-radius:9px;background:#fff2df;margin:12px 0;color:#68430e}.feedback.correct{background:#e5f5eb;color:#175d38}.tag{display:inline-block;background:#dbeafa;border-radius:50px;padding:4px 10px;font-size:12px;font-weight:700}.mastery-count{font-size:22px;font-weight:800;color:#176d54}.end{padding:18px;background:#e8f7ee;border-radius:12px}.field{display:block;width:100%;padding:12px;border:1px solid #b9cce0;border-radius:9px;font:inherit;color:#17334f}.label{display:block;font-weight:700;margin:14px 0 6px}.example{border:1px solid #dce6f2;padding:16px;border-radius:12px;background:#f9fcff;margin:12px 0}.principle{border-left:6px solid;padding:12px 15px;margin:12px 0;border-radius:8px;background:#f8fbff}.green{border-color:#128a51}.purple{border-color:#8054a4}.blue{border-color:#1186b6}.stepbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0}.stepbar>div{background:#e9f3fb;border-radius:12px;padding:12px 8px;text-align:center;font-weight:800;font-size:13px}.stepbar span{display:block;font-weight:400;margin-top:5px}.procedure{display:grid;gap:9px}.procedure button{border-left:5px solid #c7dbe9}.procedure button.highlighted{border-left-color:#c7961e}textarea{min-height:95px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{font-size:13px;color:#5b7489}@media(max-width:800px){.layout{display:block}aside{position:static;margin-bottom:18px}nav{display:grid;grid-template-columns:repeat(2,1fr)}.panel{padding:18px}.two,.stepbar{grid-template-columns:1fr 1fr}}
</style></head><body><header><div class="eyebrow" style="color:#a8cbe7">CUED 3500 · UDL Lesson Planning</div><h1>Chapter 4: UDL Implementation</h1><p>Find it · Name it · Plan it · Highlight it</p></header><div class="layout"><aside><h2>Your learning path</h2><nav id="nav"></nav><div class="small" id="progressText"></div><div class="progress"><div id="progressBar"></div></div><p class="small">Practice the actual lesson-planning process. Retry four mastery challenges until you earn 4/4.</p><label for="studentCode"><strong>Your six-digit code</strong></label><input id="studentCode" class="field" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="000000" style="margin:8px 0"><button class="primary" id="saveCode" style="width:100%">Save code / Switch student</button><button class="secondary" id="resetCode" style="width:100%;margin-top:8px">Start fresh for this code</button><p class="small" id="syncStatus" aria-live="polite">Enter your code to record progress.</p><p class="small"><a href="index.html">Chapter 1</a> · <a href="chapter2.html">Chapter 2</a> · <a href="chapter3.html">Chapter 3</a></p></aside><main class="panel"><div id="content"></div><div class="actions"><button class="secondary" id="prev">← Previous</button><button class="primary" id="next">Next section →</button></div></main></div><script>
const ENDPOINT='https://script.google.com/macros/s/AKfycbzIzwQkZEqVtGKF7g3-XSpEajvDp6wRi5hqYjyo5VZ96IGu4vOYJ-N_hjojvgmZaTtH/exec';
const PREFIX='cued3500_ch4_interactive_v1_';const titles=['Find: Explore CAST','Match: Choose an Indicator','Name & Plan: Be Specific','Highlight: Prove It','Review: Your Three Choices','Mastery Lab'];
const indicators=[{area:'Engagement',name:'Optimize choice and autonomy',detail:'Children choose which of two familiar habitats to use while practicing the same science objective.',img:'cast-choice.png'},{area:'Engagement',name:'Foster collaboration, interdependence, and collective learning',detail:'Teams have distinct roles, a shared goal, and an opportunity to learn from each other.',img:'cast-collaboration.png'},{area:'Representation',name:'Illustrate through multiple media',detail:'The teacher pairs an explanation with a diagram and physical model.',img:'cast-illustrate.png'},{area:'Action & Expression',name:'Use multiple media for communication',detail:'Children can communicate the same science explanation through a labeled model plus oral explanation or a written response.',img:'cast-communication.png'}];
const match=[{prompt:'During teaching, the teacher uses a food-chain diagram and movable organism cards to illustrate the same idea that is described in the reading.',opts:['Illustrate through multiple media','Use multiple media for communication','Optimize choice and autonomy'],answer:0,hint:'Ask who is providing the media. The teacher is presenting content to learners.'},{prompt:'Children can communicate their explanation of energy transfer through either a written response or an annotated model with an oral explanation. Both must show the same science understanding.',opts:['Illustrate through multiple media','Use multiple media for communication','Foster collaboration, interdependence, and collective learning'],answer:1,hint:'The students are communicating their understanding.'},{prompt:'Each team has a model-builder, evidence-finder, and explanation-checker; members share information to complete one accurate food chain.',opts:['Optimize choice and autonomy','Foster collaboration, interdependence, and collective learning','Illustrate through multiple media'],answer:1,hint:'This is purposeful interdependence, not merely sitting in a group.'}];
const procedure=[{id:'eng',label:'Engagement · Foster collaboration, interdependence, and collective learning',lines:['I will explain the objective and distribute the food-chain reading.','Students will work in teams with assigned roles: model-builder, evidence-finder, and explanation-checker. Each role contributes to one shared food-chain explanation.','I will collect the exit ticket before students leave.'],correct:1},{id:'rep',label:'Representation · Illustrate through multiple media',lines:['I will read the short text aloud while displaying a food-chain diagram and modeling the relationships with movable organism cards.','Students will write their names on their papers.','I will ask students to place materials back in the bin.'],correct:0},{id:'act',label:'Action & Expression · Use multiple media for communication',lines:['I will explain the directions before independent practice.','Students will complete an exit ticket.','To show how energy moves, students may write an explanation or create an annotated food-chain model and explain it orally. Both options must identify the direction of energy transfer.'],correct:2}];
const mastery=[{title:'Representation or expression?',prompt:'Which action best fits “Illustrate through multiple media”?',options:['Students record an audio response instead of writing.','The teacher uses an illustration and a physical model alongside a written explanation.','Students choose their favorite science topic without a common objective.'],correct:1,hint:'Representation is about how learners access the content.'},{title:'Purposeful collaboration',prompt:'Which plan actually demonstrates “Foster collaboration, interdependence, and collective learning”?',options:['Students sit at tables in groups of four.','Students complete worksheets individually while seated together.','Students have complementary roles and combine their evidence to create and check a shared model.'],correct:2,hint:'Look for clear roles and shared responsibility.'},{title:'Exact wording, specific implementation',prompt:'Which UDL Implementation entry follows the requirements for this lesson plan?',options:['Representation: 2.5. I will do UDL activities.','Representation: Illustrate through multiple media. During the mini-lesson, I will use a food-chain diagram and movable organism cards alongside the written explanation.','Representation: I will show a cool video because kids like technology.'],correct:1,hint:'Use the exact indicator words, followed by a concrete teaching action. The number is not required.'},{title:'Highlight what actually happens',prompt:'You named “Use multiple media for communication.” Which procedure sentence should be highlighted?',options:['I will use a diagram and video to teach the food chain.','Students will sit in groups of three.','Students may show the same energy-transfer explanation in writing or through an annotated model with an oral explanation.'],correct:2,hint:'Find the moment when students use different media to communicate learning.'}];
let code=localStorage.getItem('cued3500_student_code')||'';
function fresh(){return {page:0,matchPick:{},matchDone:{},planPick:{},highlightPick:{},highlightDone:{},draft:{},mastery:{},masteryPick:{},feedback:{},metrics:{clicks:0,practiceAttempts:0,masteryAttempts:0,activeSeconds:0,sections:{}}}}
function load(c){let s;try{s=JSON.parse(localStorage.getItem(PREFIX+c))}catch(e){}if(!s||typeof s!=='object')s=fresh();for(let [k,v] of Object.entries(fresh()))s[k]??=v;s.metrics.sections??={};return s}
let state=load(code),lastActive=Date.now(),syncTimer=null;
function valid(){return /^\d{6}$/.test(code)}function save(){if(valid())try{localStorage.setItem(PREFIX+code,JSON.stringify(state))}catch(e){}}
function sectionMetric(){return state.metrics.sections[String(state.page+1)]??={clicks:0,practiceAttempts:0,visits:0}}
function tick(){let now=Date.now();if(document.visibilityState==='visible')state.metrics.activeSeconds+=Math.max(0,Math.min((now-lastActive)/1000,30));lastActive=now}
function track(kind){tick();state.metrics.clicks++;let m=sectionMetric();m.clicks++;if(kind==='practice'){state.metrics.practiceAttempts++;m.practiceAttempts++}if(kind==='mastery')state.metrics.masteryAttempts++;if(kind==='visit')m.visits++;save();schedule()}
function deviceId(){let k='cued3500_device_id',id=localStorage.getItem(k);if(!id){id=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();localStorage.setItem(k,id)}return id}
function send(){if(!valid())return;tick();save();let score=Object.values(state.mastery).filter(Boolean).length;let payload={code,chapter:4,deviceId:deviceId(),updatedAt:new Date().toISOString(),clicks:state.metrics.clicks,practiceAttempts:state.metrics.practiceAttempts,masteryAttempts:state.metrics.masteryAttempts,activeSeconds:Math.round(state.metrics.activeSeconds),sections:state.metrics.sections,score,status:score===4?'Complete':'In progress'};fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),keepalive:true}).then(()=>{document.getElementById('syncStatus').textContent='Progress sent for code '+code+' (receipt not verified).'}).catch(()=>{document.getElementById('syncStatus').textContent='Could not send progress; answers remain saved here.'})}
function schedule(){if(!valid())return;clearTimeout(syncTimer);syncTimer=setTimeout(send,1800)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fb(k){let f=state.feedback[k];return f?`<div class="feedback ${f.ok?'correct':''}" role="status">${esc(f.text)}</div>`:''}
function img(file,caption){return `<figure><img src="assets/${file}" alt="Screenshot of CAST UDL Guidelines 3.0: ${esc(caption)}" loading="lazy"><figcaption>${esc(caption)}</figcaption></figure>`}
function choices(options,pick,attr,index){return `<div class="choices">${options.map((x,j)=>`<button type="button" class="choice ${pick===j?'selected':''}" ${attr}="${index}" data-option="${j}">${esc(x)}</button>`).join('')}</div>`}
function steps(){return '<div class="stepbar"><div>FIND<span>Explore CAST</span></div><div>NAME<span>Exact indicator words</span></div><div>PLAN<span>Specific teacher/student action</span></div><div>HIGHLIGHT<span>Find it in procedures</span></div></div>'}
function explore(){return `<div class="eyebrow">Section 1 · Guided website exploration</div><h2>Use CAST as a planning tool</h2><p>You already know the three UDL principles. Now learn how to find an actual indicator and turn it into something you can teach.</p>${steps()}<div class="note"><strong>For this first lesson plan:</strong> choose <strong>ONE indicator from each principle</strong> (Engagement, Representation, Action & Expression). Copy the <strong>exact indicator wording</strong>. You do <strong>not</strong> need indicator numbers. You can use more UDL strategies in your lesson, but only name and plan one from each area.</div><p><a href="https://udlguidelines.cast.org/" target="_blank" rel="noopener noreferrer"><strong>Open the CAST UDL Guidelines 3.0 in a new tab ↗</strong></a>. Scroll down to the interactive three-column framework. Click a specific indicator, then read the explanation and classroom suggestions below it.</p>${img('cast-framework.png','Scroll down to this interactive framework; green is Engagement, purple is Representation, and blue is Action & Expression.')}<div class="task"><h3>Try it on the real website</h3><p>Open the green Engagement column and click <strong>Optimize choice and autonomy</strong>. Notice that CAST gives suggestions about choices aligned with the learning goal, not random choices.</p>${img('cast-choice.png','An indicator page gives you the exact words, an explanation, and practical classroom ideas.')}<p class="mini">You may use your printed framework to find a name, but the website is especially useful when you need ideas for <em>how</em> to use it.</p></div><div class="warn"><strong>Remember:</strong> A guideline is not your lesson plan. “Use multiple media” is not enough. You must say which media, when, and what they help children learn.</div>`}
function matching(){return `<div class="eyebrow">Section 2 · Practice matching</div><h2>Match the activity to the indicator</h2><p>Read what actually happens in a lesson. Choose the indicator that best describes the <em>purpose</em> of that action. Some strategies could support more than one indicator, but these examples have a clear best fit.</p><div class="two"><div class="principle purple"><strong>Representation</strong><p>How the teacher makes content accessible and understandable.</p></div><div class="principle blue"><strong>Action & Expression</strong><p>How students interact and communicate what they know.</p></div></div>${img('cast-illustrate.png','Representation: Illustrate through multiple media.')}${img('cast-communication.png','Action & Expression: Use multiple media for communication.')}${match.map((q,i)=>`<div class="task"><h3>Practice ${i+1}</h3><p>${esc(q.prompt)}</p>${choices(q.opts,state.matchPick[i],'data-matchpick',i)}<button class="primary" data-matchcheck="${i}">Check match</button>${fb('match'+i)}</div>`).join('')}<div class="note"><strong>Another important distinction:</strong> Sitting in a group is not automatically collaboration. CAST describes shared goals, roles, responsibilities, and opportunities to learn from one another.</div>${img('cast-collaboration.png','Engagement: Foster collaboration, interdependence, and collective learning.')}`}
function planning(){let examples=[{area:'Engagement',name:'Foster collaboration, interdependence, and collective learning',bad:'Students will do groupwork.',good:'During the food-chain task, I will assign each team a model-builder, evidence-finder, and explanation-checker. Each member must contribute to one shared, accurate model.'},{area:'Representation',name:'Illustrate through multiple media',bad:'I will use technology.',good:'During the mini-lesson, I will explain the food chain using a diagram and movable organism cards alongside the short reading.'},{area:'Action & Expression',name:'Use multiple media for communication',bad:'Students will have choices.',good:'To explain energy transfer, students may write a response or annotate a model and explain it orally. Both options must show the direction energy moves.'}];return `<div class="eyebrow">Section 3 · Name and plan</div><h2>Exact indicator. Your specific implementation.</h2><p><strong>NAME:</strong> copy the indicator wording exactly from CAST. <strong>PLAN:</strong> explain what will happen in your lesson. The number is optional and not graded.</p>${examples.map((x,i)=>`<div class="principle ${['green','purple','blue'][i]}"><strong>${x.area}: ${x.name}</strong><p><strong>Too vague:</strong> ${x.bad}</p><p><strong>Specific:</strong> ${x.good}</p></div>`).join('')}<div class="task"><h3>Repair a vague plan</h3><p>A candidate writes: <em>Engagement: Foster collaboration, interdependence, and collective learning. Students will work in groups.</em></p><p>Which implementation is specific enough to teach?</p>${choices(['Students will work together because collaboration is important.','Students will sit in groups and complete their own worksheets.','During the food-chain task, each team member will have a different role and the team will combine evidence into one shared model.'],state.planPick.repair,'data-planpick','repair')}<button class="primary" data-plancheck="repair">Check revision</button>${fb('repair')}</div><div class="warn">Don't just paste an AI-generated list of UDL strategies. The exact indicator wording comes from CAST; the plan must describe <strong>your</strong> lesson.</div>`}
function highlighting(){return `<div class="eyebrow">Section 4 · Interactive highlighting</div><h2>Highlight where UDL happens</h2><p>After naming and planning each strategy, find the matching action in your <strong>instructional procedures</strong>. Click the sentence that should be highlighted for each indicator. Your choice turns yellow, just like a highlight in your lesson plan.</p><div class="note">A UDL statement that never appears in the procedures is only a promise. Your procedures must show what the teacher and students actually do.</div>${procedure.map((p,i)=>`<div class="task"><h3>${esc(p.label)}</h3><p class="mini">Select the one sentence that demonstrates this indicator.</p><div class="procedure">${p.lines.map((line,j)=>`<button class="sentence-button ${state.highlightPick[p.id]===j?'highlighted':''}" data-highlight="${p.id}" data-option="${j}">${esc(line)}</button>`).join('')}</div><div class="task-tools"><button class="primary" data-highlightcheck="${p.id}">Check highlight</button></div>${fb('highlight'+p.id)}</div>`).join('')}<div class="note"><strong>In your actual lesson plan:</strong> highlight the specific instruction text for each of your three named UDL strategies. If you cannot find it, revise the procedures or choose an indicator that truly matches your teaching.</div>`}
function review(){let areas=[['eng','Engagement','green'],['rep','Representation','purple'],['act','Action & Expression','blue']];return `<div class="eyebrow">Section 5 · Transfer to your lesson plan</div><h2>Build your three UDL entries</h2><p>Use the real CAST site and your own objective. Draft exactly one indicator and its specific implementation for each area. This working draft is saved <strong>on this browser</strong> for your student code. It is not submitted to your instructor.</p>${areas.map(([key,label,color])=>`<div class="task"><div class="principle ${color}"><strong>${label}</strong></div><label class="label" for="${key}name">Exact indicator wording (no number needed)</label><input class="field" id="${key}name" data-draft="${key}.name" value="${esc(state.draft[key]?.name||'')}" placeholder="Copy the indicator words from CAST"><label class="label" for="${key}how">How will you implement it in this lesson?</label><textarea class="field" id="${key}how" data-draft="${key}.how" placeholder="What will the teacher and students actually do?">${esc(state.draft[key]?.how||'')}</textarea><label class="label" for="${key}where">Where will this appear in your instructional procedures?</label><textarea class="field" id="${key}where" data-draft="${key}.where" placeholder="Write or paste the matching procedure sentence. You will highlight it in your real lesson plan.">${esc(state.draft[key]?.where||'')}</textarea></div>`).join('')}<div class="task-tools"><button class="primary" id="copyDraft">Copy my three UDL entries</button><button class="secondary" id="reviewDraft">Check my structure</button></div>${fb('draft')}<div class="warn">This tool can check whether all nine fields are filled in. It <strong>cannot</strong> verify that you copied CAST's exact wording or that your teaching action is well aligned. Check those yourself before submitting.</div>`}
function lab(){let score=Object.values(state.mastery).filter(Boolean).length;return `<div class="eyebrow">Section 6 · Four mastery points</div><h2>UDL Implementation Mastery Lab</h2><p>Make four lesson-planning decisions. Incorrect responses receive feedback; retry without losing earned points.</p><div class="note"><span class="mastery-count">${score}/4</span> mastery points earned</div>${mastery.map((q,i)=>`<div class="task"><span class="tag">Challenge ${i+1}</span><h3>${esc(q.title)} ${state.mastery[i]?'✓':''}</h3><p>${esc(q.prompt)}</p>${choices(q.options,state.masteryPick[i],'data-mpick',i)}<button class="primary" data-mcheck="${i}" ${state.mastery[i]?'disabled':''}>${state.mastery[i]?'Mastered':'Check challenge'}</button>${fb('m'+i)}</div>`).join('')}${score===4?'<div class="end"><strong>Chapter 4 mastered: 4/4!</strong><p>Return to your lesson plan. Name one indicator from each UDL principle, explain exactly how each will happen, and highlight the matching procedure text.</p></div>':''}`}
function render(){let p=state.page;document.getElementById('nav').innerHTML=titles.map((t,i)=>`<button data-nav="${i}" class="${i===p?'active':''}">${i+1}. ${esc(t)} ${i===5?'★':''}</button>`).join('');let score=Object.values(state.mastery).filter(Boolean).length;document.getElementById('progressText').textContent=`Chapter 4: section ${p+1} of 6 · Mastery ${score}/4`;document.getElementById('progressBar').style.width=score*25+'%';document.getElementById('content').innerHTML=[explore,matching,planning,highlighting,review,lab][p]();document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(Number(b.dataset.nav)));document.getElementById('prev').disabled=p===0;document.getElementById('prev').onclick=()=>go(Math.max(0,p-1));document.getElementById('next').textContent=p===5?'Return to first section':'Next section →';document.getElementById('next').onclick=()=>go((p+1)%6);wire()}
function go(n){state.page=n;track('visit');render();window.scrollTo(0,0)}
function response(key,ok,success,hint){state.feedback[key]={ok,text:ok?success:hint};track('practice');render()}
function wire(){document.querySelectorAll('[data-matchpick]').forEach(b=>b.onclick=()=>{state.matchPick[b.dataset.matchpick]=Number(b.dataset.option);track('click');render()});document.querySelectorAll('[data-matchcheck]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.matchcheck),q=match[i];response('match'+i,state.matchPick[i]===q.answer,'Correct. '+q.hint,'Not yet. '+q.hint)});document.querySelectorAll('[data-planpick]').forEach(b=>b.onclick=()=>{state.planPick[b.dataset.planpick]=Number(b.dataset.option);track('click');render()});document.querySelectorAll('[data-plancheck]').forEach(b=>b.onclick=()=>response('repair',state.planPick.repair===2,'Yes. Roles and a shared product make the collaboration concrete.','Try again. A good implementation says what each learner will do and how they will depend on one another.'));document.querySelectorAll('[data-highlight]').forEach(b=>b.onclick=()=>{state.highlightPick[b.dataset.highlight]=Number(b.dataset.option);track('click');render()});document.querySelectorAll('[data-highlightcheck]').forEach(b=>b.onclick=()=>{let p=procedure.find(x=>x.id===b.dataset.highlightcheck),ok=state.highlightPick[p.id]===p.correct;response('highlight'+p.id,ok,'Yes. This sentence shows the exact strategy happening in instruction.','Choose the sentence that actually implements the named indicator, not just a general lesson step.')});document.querySelectorAll('[data-draft]').forEach(el=>el.oninput=()=>{let [area,key]=el.dataset.draft.split('.');state.draft[area]??={};state.draft[area][key]=el.value;track('click')});let copy=document.getElementById('copyDraft');if(copy)copy.onclick=()=>{let txt=['eng','rep','act'].map((k,i)=>{let d=state.draft[k]||{};return `${['Engagement','Representation','Action & Expression'][i]}\nIndicator: ${d.name||''}\nHow: ${d.how||''}\nProcedure to highlight: ${d.where||''}`}).join('\n\n');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>{state.feedback.draft={ok:true,text:'Draft copied. Paste it into your lesson plan and highlight the three procedure passages.'};render()}).catch(()=>{state.feedback.draft={ok:false,text:'Copy was blocked. Select your draft text manually.'};render()});else{state.feedback.draft={ok:false,text:'Clipboard unavailable. Select and copy your text manually.'};render()}};let check=document.getElementById('reviewDraft');if(check)check.onclick=()=>{let ok=['eng','rep','act'].every(k=>['name','how','where'].every(field=>state.draft[k]?.[field]?.trim()));state.feedback.draft={ok,text:ok?'All three areas have an indicator, an implementation, and a matching procedure. Check exact CAST wording and alignment yourself.':'Fill in one exact indicator, one specific implementation, and the matching procedure for each of the three principles.'};track('practice');render()};document.querySelectorAll('[data-mpick]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.mpick);if(state.mastery[i])return;state.masteryPick[i]=Number(b.dataset.option);track('click');render()});document.querySelectorAll('[data-mcheck]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.mcheck),q=mastery[i],ok=state.masteryPick[i]===q.correct;if(ok)state.mastery[i]=true;state.feedback['m'+i]={ok,text:ok?'Correct. Mastery point earned.':state.masteryPick[i]===undefined?'Select an answer first.':q.hint+' Try again.'};track('mastery');render()})}
const input=document.getElementById('studentCode'),status=document.getElementById('syncStatus');input.value=code;status.textContent=valid()?'Your code: '+code:'Enter your code to record progress.';
document.getElementById('saveCode').onclick=()=>{let next=input.value.trim();if(!/^\d{6}$/.test(next)){status.textContent='Enter exactly six digits.';return}if(next===code){send();return}if(valid()){tick();save();send()}clearTimeout(syncTimer);code=next;localStorage.setItem('cued3500_student_code',code);state=load(code);lastActive=Date.now();render();status.textContent='Switched to '+code+'. Saved Chapter 4 progress restored if present.';send()};
document.getElementById('resetCode').onclick=()=>{if(!valid()){status.textContent='Save a six-digit code first.';return}if(!confirm('Start Chapter 4 fresh for '+code+'? This clears saved answers on this browser, not past Google Sheets records.'))return;clearTimeout(syncTimer);state=fresh();save();render();send();status.textContent='Fresh Chapter 4 started for '+code};
document.addEventListener('visibilitychange',()=>{tick();save();if(document.visibilityState==='hidden')send()});setInterval(()=>{if(document.visibilityState==='visible'){tick();save();schedule()}},30000);window.addEventListener('pagehide',()=>{tick();save();send()});render();
</script></body></html>
